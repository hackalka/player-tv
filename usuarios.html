<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA CENTRAL - Monitor de Recursos</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #f5c518; --bg: #06090e; --surface: #10141d; --border: #232c3d; --blue: #3498db; --red: #e74c3c; }
        body { background: var(--bg); color: #e2e8f0; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: none; }
        .container { max-width: 1200px; margin: auto; }
        
        /* Cabecera */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin-bottom: 25px; }

        /* Tarjetas de Estadísticas */
        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 12px; text-align: center; position: relative; }
        .stat-card i { color: var(--gold); font-size: 28px; margin-bottom: 10px; }
        .stat-card h3 { margin: 5px 0; font-size: 24px; color: white; }
        .stat-card p { margin: 0; color: #888; font-size: 13px; text-transform: uppercase; }

        /* Barra de Capacidad */
        .progress-container { background: #1a202c; border-radius: 10px; height: 12px; margin-top: 15px; overflow: hidden; }
        .progress-bar { background: linear-gradient(90deg, #f5c518, #f39c12); height: 100%; transition: width 1s ease-in-out; }

        /* Tablas */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { color: var(--gold); font-size: 11px; text-transform: uppercase; }
        
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .bg-green { background: #27ae60; color: white; }
        .btn-kick { background: var(--red); border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa fa-server"></i> MONITOR DE INFRAESTRUCTURA</h1>
        <div id="reloj" style="color: var(--gold); font-family: monospace;"></div>
    </div>

    <div class="grid-stats">
        <div class="stat-card">
            <i class="fa fa-bolt"></i>
            <h3 id="con-sim">0</h3>
            <p>Conexiones Simultáneas</p>
            <div class="progress-container">
                <div id="bar-con" class="progress-bar" style="width: 0%"></div>
            </div>
            <small style="font-size: 9px; color: #555;">Límite Spark: 100</small>
        </div>
        <div class="stat-card">
            <i class="fa fa-hdd"></i>
            <h3 id="db-size">Calculando...</h3>
            <p>Uso de Base de Datos</p>
            <div class="progress-container">
                <div id="bar-size" class="progress-bar" style="width: 0.5%"></div>
            </div>
            <small style="font-size: 9px; color: #555;">Límite Spark: 1 GB</small>
        </div>
        <div class="stat-card">
            <i class="fa fa-users"></i>
            <h3 id="total-visitas">0</h3>
            <p>Visitas Totales (Sesiones)</p>
        </div>
    </div>

    <div class="card">
        <h2><i class="fa fa-plug" style="color: #2ecc71"></i> Tráfico en Tiempo Real</h2>
        <table>
            <thead>
                <tr>
                    <th>Estado</th>
                    <th>ID de Sesión</th>
                    <th>Plataforma / SO</th>
                    <th>Última Actividad</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="user-list"></tbody>
        </table>
    </div>

    <div class="card">
        <h2><i class="fa fa-user-slash" style="color: var(--red)"></i> Usuarios Bloqueados</h2>
        <table id="ban-list">
            <thead>
                <tr><th>ID Bloqueado</th><th>Acción</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    // --- SEGURIDAD ---
    const _p = "Y2thbGthMjI3NA=="; 
    if (prompt("Acceso Reservado:") !== atob(_p)) { window.location.href = "https://google.com"; } 
    else { document.body.style.display = "block"; }

    // --- FIREBASE ---
    const _db = "aHR0cHM6Ly9wbGF5ZXJ0di05NDQ5Yy1kZWZhdWx0LXJ0ZGIuZXVyb3BlLXdlc3QxLmZpcmViYXNlZGF0YWJhc2UuYXBwLw==";
    firebase.initializeApp({ databaseURL: atob(_db) });
    const db = firebase.database();

    // 1. MONITOR DE CONEXIONES Y VISITAS
    db.ref('conexiones').on('value', snap => {
        const users = snap.val() || {};
        const tbody = document.getElementById('user-list');
        tbody.innerHTML = '';
        
        let activeCount = Object.keys(users).length;
        document.getElementById('con-sim').innerText = activeCount;
        
        // Actualizar barra de progreso (Límite 100 en Spark)
        document.getElementById('bar-con').style.width = Math.min(activeCount, 100) + "%";

        Object.keys(users).forEach(id => {
            const u = users[id];
            tbody.innerHTML += `
                <tr>
                    <td><span class="badge bg-green">LIVE</span></td>
                    <td style="font-family: monospace;">${id}</td>
                    <td>${u.plataforma || 'Desconocido'}</td>
                    <td>${u.hora || '--:--'}</td>
                    <td><button class="btn-kick" onclick="kick('${id}')">KICK</button></td>
                </tr>`;
        });
    });

    // 2. MONITOR DE TAMAÑO (SIMULADO POR NODOS)
    // Firebase no da el tamaño exacto por JS, lo estimamos por el conteo de datos
    function estimarUso() {
        db.ref().on('value', snap => {
            const data = snap.val();
            const stringData = JSON.stringify(data);
            const sizeInBytes = stringData.length;
            const sizeInKb = (sizeInBytes / 1024).toFixed(2);
            document.getElementById('db-size').innerText = sizeInKb + " KB";
            
            // Límite Spark es 1GB (1.048.576 KB)
            let percent = (sizeInKb / 1048576) * 100;
            document.getElementById('bar-size').style.width = Math.max(percent, 0.5) + "%";
        });
    }

    // 3. GESTIÓN DE BANEO
    db.ref('baneados').on('value', snap => {
        const bans = snap.val() || {};
        const tbody = document.querySelector('#ban-list tbody');
        tbody.innerHTML = '';
        Object.keys(bans).forEach(id => {
            tbody.innerHTML += `<tr><td>${id}</td><td><button onclick="unban('${id}')" style="cursor:pointer">Desbloquear</button></td></tr>`;
        });
    });

    // 4. VISITAS TOTALES (Usando un contador permanente en Firebase)
    db.ref('estadisticas/total_visitas').on('value', snap => {
        document.getElementById('total-visitas').innerText = snap.val() || 0;
    });

    // FUNCIONES DE CONTROL
    function kick(id) { db.ref('conexiones/' + id).remove(); }
    function unban(id) { db.ref('baneados/' + id).remove(); }
    
    // Reloj
    setInterval(() => {
        document.getElementById('reloj').innerText = new Date().toLocaleString();
    }, 1000);

    estimarUso();
</script>
</body>
</html>
