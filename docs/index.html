<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tv Player</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <a href="#" class="logo"><span id="brand-name">TV+</span></a>
            <ul class="nav-links" id="nav-links"></ul>
        </div>
        <div class="navbar-right">
            <button class="icon-btn" id="admin-panel-btn" hidden>⚙️</button>
            <button class="icon-btn" id="admin-refresh" hidden>↻</button>
            <button class="icon-btn" id="admin-lock">🔒</button>
            <button class="search-btn">🔍</button>
        </div>
    </nav>

    <div id="netflix-view">
        <section class="hero" id="hero">
            <div class="hero-background"><img src="" class="hero-image" id="hero-image"><div class="hero-gradient"></div></div>
            <div class="hero-content"><h1 id="hero-title"></h1><p id="hero-description"></p>
                <div class="hero-buttons"><button class="btn btn-play" id="hero-play">▶ Reproducir</button></div>
            </div>
        </section>
        <main class="main-content"><div class="rows-container" id="rows-container"></div></main>
    </div>

    <div class="modal" id="player-modal" hidden>
        <div class="modal-overlay"></div>
        <div class="modal-content detail-modal">
            <button class="modal-close">✕</button>
            <div class="detail-hero" id="detail-hero">
                <!-- Solo Shaka Player y Video Nativo -->
                <div class="video-container" style="background:#000; width:100%; height:100%;">
                    <video id="player-video" controls playsinline style="width:100%; height:100%;"></video>
                </div>
                <!-- Menú Admin con Capítulos -->
                <div class="admin-fab" id="admin-fab" hidden>
                    <button class="admin-fab-btn" id="admin-fab-toggle">✏️</button>
                    <div class="admin-fab-menu" id="admin-fab-menu" hidden>
                        <button class="admin-fab-item" id="title-btn">✏ Título</button>
                        <button class="admin-fab-item" id="video-link-btn">🔗 Enlace</button>
                        <button class="admin-fab-item" id="add-episode-btn">➕ Añadir Capítulo</button>
                        <button class="admin-fab-item" id="edit-episodes-btn">📋 Gestionar Capítulos</button>
                    </div>
                </div>
            </div>
            <div class="modal-details"><h2 id="modal-title"></h2><p id="modal-description"></p><div id="episode-list" hidden><div id="episodes-track"></div></div></div>
        </div>
    </div>

    <!-- Motores -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="tg-config.js"></script><script src="tg-service.js"></script><script src="tg-app.js"></script>
    <script src="script.js"></script>
</body>
</html>
