<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tv Player</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left">
            <a href="#" class="logo"><img src="logo192.png" style="height:32px;margin-right:10px" onerror="this.style.display='none'"><span id="brand-name">TV+</span></a>
            <ul class="nav-links" id="nav-links"></ul>
        </div>
        <div class="navbar-right">
            <button class="icon-btn" id="admin-panel-btn" hidden>⚙️</button>
            <button class="icon-btn" id="admin-refresh" hidden>↻</button>
            <button class="icon-btn" id="admin-lock">🔒</button>
            <button class="search-btn">🔍</button>
        </div>
    </nav>

    <div id="netflix-view">
        <section class="hero" id="hero">
            <div class="hero-background"><img src="" class="hero-image" id="hero-image"><div class="hero-gradient"></div></div>
            <div class="hero-content">
                <h1 id="hero-title"></h1>
                <p id="hero-description"></p>
                <div class="hero-buttons"><button class="btn btn-play" id="hero-play">▶ Reproducir</button></div>
            </div>
        </section>
        <main class="main-content"><div class="rows-container" id="rows-container"></div></main>
    </div>

    <div class="modal" id="player-modal" hidden>
        <div class="modal-overlay"></div>
        <div class="modal-content detail-modal">
            <button class="modal-close">✕</button>
            <div class="detail-hero" id="detail-hero">
                <video id="player-video" controls playsinline style="width:100%; height:100%; background:#000;"></video>
                <div class="admin-fab" id="admin-fab" hidden>
                    <button class="admin-fab-btn" id="admin-fab-toggle">✏️</button>
                    <div class="admin-fab-menu" id="admin-fab-menu" hidden>
                        <button class="admin-fab-item" id="title-btn">✏ Título</button>
                        <button class="admin-fab-item" id="video-link-btn">🔗 Enlace</button>
                        <button class="admin-fab-item" id="add-episode-btn">➕ Capítulo</button>
                        <button class="admin-fab-item" id="edit-episodes-btn">📋 Gestionar</button>
                        <button class="admin-fab-item" id="cover-tmdb-btn">🔍 TMDB</button>
                    </div>
                </div>
            </div>
            <div class="modal-details">
                <h2 id="modal-title"></h2>
                <p id="modal-description"></p>
                <div id="episode-list" hidden><h3>Episodios</h3><div id="episodes-track"></div></div>
            </div>
        </div>
    </div>

    <div id="loading-screen" class="loading-screen"><div class="loader"></div><p>Cargando TV+...</p></div>

    <!-- Motores -->
    <script src="https://cdn.jsdelivr.net/npm/big-integer@1.6.52/BigInteger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/buffer/6.0.3/buffer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="tg-config.js"></script>
    <script src="tg-service.js"></script>
    <script src="tg-app.js"></script>
    <script src="script.js"></script>
</body>
</html>
