<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a1a3a">
    <title>Tv Player</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-left"><a href="#" class="logo"><span id="brand-name">TV+</span></a><ul class="nav-links" id="nav-links"></ul></div>
        <div class="navbar-right">
            <button class="icon-btn" id="admin-panel-btn" hidden>⚙</button>
            <button class="icon-btn" id="admin-refresh" hidden>↻</button>
            <button class="icon-btn" id="admin-lock">🔒</button>
            <button class="search-btn">🔍</button>
        </div>
    </nav>
    <div id="netflix-view"><section class="hero" id="hero"><div class="hero-content"><h1 id="hero-title"></h1><p id="hero-description"></p><div class="hero-buttons"><button class="btn btn-play" id="hero-play">Reproducir</button></div></div></section><main class="main-content"><div class="rows-container" id="rows-container"></div></main></div>
    <div class="modal" id="player-modal" hidden><div class="modal-content detail-modal">
        <div class="detail-hero" id="detail-hero">
            <div id="artplayer-mount"></div>
            <div class="admin-fab" id="admin-fab" hidden>
                <button id="admin-fab-toggle">✏️</button>
                <div class="admin-fab-menu" id="admin-fab-menu" hidden>
                    <button id="title-btn">Título</button>
                    <button id="video-link-btn">Enlace</button>
                    <button id="add-episode-btn">＋ Capítulo</button>
                    <button id="edit-episodes-btn">📋 Gestionar</button>
                </div>
            </div>
        </div>
        <div class="modal-details"><h2 id="modal-title"></h2><p id="modal-description"></p><div id="episodes-track"></div></div>
    </div></div>
    <!-- Scripts Motores -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@artplayer/plugin-cast/dist/artplayer-plugin-cast.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer@5.3.0/dist/artplayer.js"></script>
    <script src="tg-config.js"></script><script src="tg-service.js"></script><script src="tg-app.js"></script>
    <script src="script.js"></script><script src="artplayer-bridge.js"></script>
</body>
</html>
