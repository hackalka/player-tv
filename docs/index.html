<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Tv Player — tu catálogo de cine, series y deportes">
    <meta name="theme-color" content="#0a1a3a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tv Player">
    <title>Tv Player</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo192.png">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23E50914' width='100' height='100' rx='18'/><text x='50' y='70' font-size='52' font-weight='bold' text-anchor='middle' fill='%23fff'>TV</text></svg>">
    <link rel="stylesheet" href="style.css?v=6ea8a71">
    <!-- Firebase (Firestore para favoritos/continuar viendo sincronizados) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- build: usar bundle local telegram-browser.js (deploy v2) -->
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="navbar-left">
            <a href="#" class="logo">
                <img class="brand-logo" src="logo192.png" alt="TV+" onerror="this.style.display='none'">
            </a>
            <ul class="nav-links" id="nav-links"></ul>
        </div>
        <div class="navbar-right">
            <button class="icon-btn groups-tab-btn" id="groups-tab-btn" aria-label="Grupos" title="Grupos" hidden>
                <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M16 11a3 3 0 1 0-2.83-4H16v4zM8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.67 0-8 1.34-8 4v2h12v-2c0-1.08.45-2.02 1.2-2.77A16.2 16.2 0 0 0 8 13zm8 .02c-.31 0-.65.02-1 .05 1.21.88 2 2.13 2 3.93v2h7v-2c0-2.66-5.33-3.98-8-3.98z"/></svg>
            </button>
            <button class="icon-btn" id="logout-btn" aria-label="Cerrar sesión" title="Cerrar sesión">
                <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm3 8H9V6a3 3 0 0 1 6 0v3z"/></svg>
            </button>
            <button class="search-btn" aria-label="Buscar">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M21.71 20.29L18 16.61A9 9 0 1 0 16.61 18l3.68 3.68a1 1 0 0 0 1.42 0 1 1 0 0 0 0-1.39zM11 18a7 7 0 1 1 7-7 7 7 0 0 1-7 7z"/></svg>
            </button>
        </div>
    </nav>

    <!-- ===== VISTA CINE (Netflix) ===== -->
    <div id="netflix-view">
        <section class="hero" id="hero">
            <div class="hero-background">
                <img src="" alt="" class="hero-image" id="hero-image">
                <div class="hero-gradient"></div>
            </div>
            <div class="hero-content">
                <span class="hero-badge" id="hero-badge"></span>
                <h1 class="hero-title" id="hero-title"></h1>
                <p class="hero-description" id="hero-description"></p>
                <div class="hero-buttons">
                    <button class="btn btn-play" id="hero-play">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                        Reproducir
                    </button>
                    <button class="btn btn-info" id="hero-info">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                        Más información
                    </button>
                </div>
            </div>
        </section>
        <main class="main-content">
            <div class="rows-container" id="rows-container"></div>
        </main>
    </div>

    <!-- ===== DETALLE + REPRODUCTOR ===== -->
    <div class="modal" id="player-modal" hidden>
        <div class="modal-overlay"></div>
        <div class="modal-content detail-modal">
            <button class="modal-close" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
            <div class="detail-hero" id="detail-hero">
                <button id="player-exit" class="player-exit focusable" tabindex="0" hidden>✕ Salir</button>
                <video id="player-video" controls playsinline hidden></video>
                <div id="artplayer-mount" hidden></div>
                <iframe id="player-iframe" allowfullscreen hidden></iframe>
                <iframe id="trailer-iframe" class="trailer-iframe" allow="autoplay; encrypted-media" hidden></iframe>
                <img id="detail-backdrop" class="detail-backdrop" alt="">
                <div class="detail-hero-shade"></div>
                <button id="trailer-mute" class="trailer-mute" hidden>🔊</button>
                <div class="detail-hero-content">
                    <h2 class="detail-title" id="modal-title"></h2>
                    <div class="detail-actions">
                        <button class="btn btn-play focusable" id="detail-play">
                            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                            Reproducir
                        </button>
                        <button class="btn btn-fav focusable" id="trailer-btn" aria-label="Reproducir tráiler" hidden>
                            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M21.58 7.19c-.23-.86-.91-1.54-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42c-.86.23-1.54.91-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.91 1.54 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42c.86-.23 1.54-.91 1.77-1.77C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/></svg>
                            <span>Tráiler</span>
                        </button>
                        <button class="btn btn-fav focusable" id="fav-btn" aria-label="Añadir a favoritos">
                            <span class="fav-ico">★</span> <span class="fav-txt">Añadir a favoritos</span>
                        </button>
                        <button class="btn btn-fav focusable" id="watched-btn" aria-label="Marcar como visto">
                            <span class="watched-ico">✓</span> <span class="watched-txt">Marcar como visto</span>
                        </button>
                    </div>
                </div>
                <div class="player-status" id="player-status" hidden></div>
            </div>
            <div class="modal-details">
                <div class="detail-body">
                    <img class="detail-poster" id="detail-poster" alt="">
                    <div class="detail-info">
                        <div class="modal-meta">
                            <span class="rating" id="modal-rating"></span>
                            <span class="year" id="modal-year"></span>
                            <span class="duration" id="modal-duration"></span>
                            <span class="quality">HD</span>
                        </div>
                        <div class="detail-genres" id="detail-genres"></div>
                        <p class="modal-description" id="modal-description"></p>
                    </div>
                </div>
                <div class="sources" id="sources" hidden>
                    <h3 class="sources-title">▶ Reproducir</h3>
                    <div class="sources-track" id="sources-track"></div>
                </div>
                <div class="player-options" id="player-options" hidden></div>
                <div class="episodes" id="episode-list" hidden>
                    <h3 class="episodes-title">Episodios</h3>
                    <div class="episodes-track" id="episodes-track"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== BÚSQUEDA ===== -->
    <div class="search-overlay" id="search-overlay" hidden>
        <div class="search-container">
            <input type="search" id="search-input" placeholder="Títulos, géneros, deportes..." autocomplete="off">
            <button class="search-voice" id="voice-search" aria-label="Buscar por voz" hidden>
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
            </button>
            <button class="search-close" aria-label="Cerrar búsqueda">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
        <div class="search-filters">
            <select id="filter-genre" class="filter-select"><option value="">Todos los géneros</option></select>
            <select id="filter-year" class="filter-select"><option value="">Todos los años</option></select>
            <select id="filter-quality" class="filter-select"><option value="">Cualquier calidad</option></select>
            <select id="filter-lang" class="filter-select"><option value="">Cualquier idioma</option></select>
            <select id="filter-cat" class="filter-select"><option value="">Todas las categorías</option></select>
        </div>
        <div class="search-results" id="search-results"></div>
    </div>

    <!-- ===== LOGIN POR USUARIO ===== -->
    <div class="modal" id="login-modal" hidden>
        <div class="modal-overlay"></div>
        <div class="modal-content login-box">
            <h2 class="modal-title">Entra con tu Telegram</h2>
            <p class="login-help">Inicia sesión con tu cuenta para ver el contenido. Tus datos no se comparten.</p>

            <div class="login-step" data-step="phone">
                <label class="login-label" for="login-phone">Número de teléfono (con prefijo de país)</label>
                <input id="login-phone" class="login-input" type="tel" inputmode="tel" placeholder="+34 600 00 00 00" autocomplete="tel">
                <button id="btn-send-code" class="btn btn-play login-action" type="button">Enviar código</button>
                <button id="btn-qr-login" class="btn-link" type="button" style="margin-top:14px;">📱 O entrar escaneando un código QR</button>
            </div>
            <div class="login-step" data-step="qr" hidden>
                <p class="login-help">Abre Telegram en tu móvil → <b>Ajustes → Dispositivos → Vincular dispositivo</b> y escanea este código:</p>
                <div id="qr-box" style="background:#fff;padding:16px;display:inline-block;border-radius:8px;margin:8px auto;"></div>
                <p id="qr-status" class="boot-status" style="margin-top:10px;">Generando código…</p>
                <button id="btn-qr-back" class="btn-link" type="button">‹ Volver al login normal</button>
            </div>
            <div class="login-step" data-step="code" hidden>
                <label class="login-label" for="login-code">Código recibido en Telegram</label>
                <input id="login-code" class="login-input" type="text" inputmode="numeric" placeholder="1 2 3 4 5" autocomplete="one-time-code">
                <button id="btn-verify-code" class="btn btn-play login-action" type="button">Verificar</button>
                <button id="btn-back-phone" class="btn-link" type="button">‹ Cambiar número</button>
            </div>
            <div class="login-step" data-step="password" hidden>
                <label class="login-label" for="login-password">Contraseña de verificación en dos pasos (2FA)</label>
                <input id="login-password" class="login-input" type="password" placeholder="Tu contraseña 2FA" autocomplete="current-password">
                <button id="btn-verify-password" class="btn btn-play login-action" type="button">Entrar</button>
            </div>
            <p id="login-status" class="boot-status"></p>
        </div>
    </div>

    <!-- ===== LOADING ===== -->
    <div class="loading-screen" id="loading-screen">
        <div class="loading-inner">
            <div class="loader"></div>
            <p id="loading-text">Cargando Tv Player...</p>
        </div>
    </div>

    <!-- Import map: sustituye el 'crypto' de Node por crypto-browserify (createHash real) -->
    <script type="importmap">
    {
      "imports": {
        "crypto": "https://esm.sh/crypto-browserify@3.12.1?target=es2022",
        "node:crypto": "https://esm.sh/crypto-browserify@3.12.1?target=es2022"
      }
    }
    </script>
    <!-- Motor Telegram (GramJS) + dependencias -->
    <!-- QR para el login alternativo -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script>
        try { window.Buffer = window.Buffer || (window.buffer && window.buffer.Buffer); } catch (e) { }
        if (!window.global) window.global = window;
        if (!window.process) window.process = { env: {}, browser: true, version: 'v18.0.0', nextTick: function (f) { Promise.resolve().then(f); } };
        window.__tgReady = new Promise(function (res, rej) { window.__tgResolve = res; window.__tgReject = rej; });
        (function () {
            // Usa primero el bundle local; conecta con Telegram solo cuando el usuario inicia sesión.
            async function polyfills() {
                if (!globalThis.global) globalThis.global = globalThis;
                if (!globalThis.process) globalThis.process = { env: {}, browser: true, version: 'v18.0.0', nextTick: function (f) { Promise.resolve().then(f); } };
                if (!globalThis.Buffer) {
                    var SRC = ['https://cdn.jsdelivr.net/npm/buffer@6.0.3/+esm', 'https://esm.sh/buffer@6.0.3'];
                    for (var i = 0; i < SRC.length; i++) {
                        try {
                            var m = await import(SRC[i]);
                            var B = m.Buffer || (m.default && m.default.Buffer);
                            if (B) { globalThis.Buffer = B; window.Buffer = B; console.log('[tg-loader] Buffer polyfill OK'); break; }
                        } catch (e) { }
                    }
                    if (!globalThis.Buffer) console.warn('[tg-loader] no se pudo cargar el polyfill de Buffer');
                }
            }
            var UMD = [
                'telegram-browser.js',
                'https://cdn.jsdelivr.net/npm/telegram@2.19.10/browser/telegram.js',
                'https://cdn.jsdelivr.net/npm/telegram@2.22.2/browser/telegram.js',
                'https://unpkg.com/telegram@2.19.10/browser/telegram.js'
            ];
            function loadScript(src) {
                return new Promise(function (res, rej) {
                    var s = document.createElement('script'); s.src = src; s.async = false;
                    s.onload = function () { res(); }; s.onerror = function () { rej(new Error(src)); };
                    document.head.appendChild(s);
                });
            }
            // Carga un bundle local via fetch + eval. Mas fiable que <script> con 304/MIME.
            async function loadLocalUmd(src) {
                var r = await fetch(src);
                if (!r.ok) throw new Error('HTTP ' + r.status);
                var code = await r.text();
                if (code.length < 1000) throw new Error('archivo demasiado pequeño (' + code.length + ' bytes)');
                // Ejecuta el UMD en el ambito global; webpack lo cuelga de window.telegram
                (0, eval)(code);
                applyTLTolerance();
            }
            // Parchea el lector binario para tolerar constructores TL desconocidos.
            // Si Telegram envia un constructor que esta version de GramJS no conoce,
            // en vez de lanzar y romper la conexion, descartamos ese paquete y seguimos.
            function applyTLTolerance() {
                try {
                    var BR = window.telegram && ((window.telegram.extensions && window.telegram.extensions.BinaryReader) || window.telegram.BinaryReader);
                    if (!BR || !BR.prototype || !BR.prototype.tgReadObject) {
                        console.warn('[tg-patch] BinaryReader no expuesto, no puedo aplicar patch TL');
                        return;
                    }
                    if (BR.prototype.__tvpPatched) return;
                    var orig = BR.prototype.tgReadObject;
                    BR.prototype.tgReadObject = function () {
                        try { return orig.apply(this, arguments); }
                        catch (e) {
                            var msg = (e && e.message) || '';
                            if (/Could not find a matching Constructor|Missing MTProto Entity/i.test(msg)) {
                                var m = msg.match(/ID\s+(\d+)/);
                                console.warn('[tg-patch] constructor desconocido', m ? m[1] : '?', '— ignorando paquete');
                                // Avanzar al final del buffer para no quedarnos atascados
                                try { if (typeof this.stream !== 'undefined' && this.stream && this.stream.length != null) this.offset = this.stream.length; } catch (e2) { }
                                try { if (this._buffer && this._buffer.length != null) this.offset = this._buffer.length; } catch (e2) { }
                                return null;
                            }
                            throw e;
                        }
                    };
                    BR.prototype.__tvpPatched = true;
                    console.log('[tg-patch] BinaryReader parcheado: tolera constructores TL desconocidos');
                } catch (e) {
                    console.warn('[tg-patch] no se pudo parchear BinaryReader:', e && e.message);
                }
            }
            function waitGlobal(ms) {
                return new Promise(function (res) {
                    var n = Math.ceil((ms || 5000) / 100);
                    (function chk() { if (window.telegram && window.telegram.TelegramClient) return res(true); if (n-- <= 0) return res(false); setTimeout(chk, 100); })();
                });
            }
            (async function () {
                await polyfills();
                // 1) UMD clasico (dist/index.js): expondria window.telegram con crypto nativo del navegador
                for (var u = 0; u < UMD.length; u++) {
                    var src = UMD[u];
                    var isLocal = !/^https?:/i.test(src); // bundle local que servimos nosotros
                    try {
                        if (isLocal) await loadLocalUmd(src);
                        else await loadScript(src);
                    }
                    catch (e) { console.warn('[tg-loader] UMD no carga', src, e && e.message); continue; }
                    if (!(await waitGlobal(4000))) { console.warn('[tg-loader] UMD cargó pero SIN window.telegram (probablemente es CommonJS):', src); continue; }
                    console.log('[tg-loader] GramJS cargado (UMD) via', src, '; la conexión se hará al iniciar sesión.');
                    return window.__tgResolve(window.telegram);
                }
                console.error('[tg-loader] No se pudo cargar GramJS desde las fuentes UMD');
                window.__tgReject(new Error('No se pudo cargar GramJS'));
            })();
        })();
    </script>
    <!-- Capa cliente (reemplaza al servidor) -->
    <script src="tg-config.js?v=6ea8a71"></script>
    <script src="tg-service.js?v=poster-fix-1"></script>
    <script src="tg-app.js?v=metadata-tags-1"></script>
    <!-- Frontend -->
    <script src="script.js?v=poster-fix-1"></script>
    <!-- Reproductor avanzado MKV/AVI (FFmpeg.wasm, lazy load) -->
    <script src="mkv-player.js"></script>
    <!-- Reproductor Artplayer (UI) + hls.js, inspirado en iptvnator (MIT) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer@5.3.0/dist/artplayer.js" defer></script>
    <script src="artplayer-bridge.js" defer></script>
    <!-- Teclado virtual on-screen (TV-box / mando DPad) -->
    <script src="tv-keyboard.js"></script>
    <script>
        // Conectar el boton "Entrar con QR" del modal de login con la funcion QR de tg-app.js
        (function () {
            function $(id) { return document.getElementById(id); }
            function setStep(step) {
                Array.prototype.forEach.call(document.querySelectorAll('.login-step'), function (s) {
                    s.hidden = s.getAttribute('data-step') !== step;
                });
            }
            function renderQR(url) {
                var box = $('qr-box'); if (!box || !window.qrcode) return;
                box.innerHTML = '';
                var qr = qrcode(0, 'M'); qr.addData(url); qr.make();
                box.innerHTML = qr.createSvgTag({ cellSize: 5, margin: 2 });
            }
            function setStatus(msg) { var s = $('qr-status'); if (s) s.innerText = msg || ''; }
            function start() {
                setStep('qr');
                setStatus('Generando código…');
                if (!window.TVP_QR || !window.TVP_QR.start) { setStatus('Espera unos segundos a que cargue la librería e intenta de nuevo.'); return; }
                window.TVP_QR.start({
                    onUrl: renderQR,
                    onStatus: setStatus,
                    askPassword: function () { return prompt('Tu contraseña 2FA:') || ''; }
                }).catch(function (e) { setStatus('Error: ' + (e && (e.errorMessage || e.message))); });
            }
            document.addEventListener('DOMContentLoaded', function () {
                var b = $('btn-qr-login'); if (b) b.addEventListener('click', start);
                var back = $('btn-qr-back'); if (back) back.addEventListener('click', function () { setStep('phone'); });
            });
        })();
    </script>
</body>
</html>
