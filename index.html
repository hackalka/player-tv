<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PLAYER TV - Premium Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="css/reproductor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Fix de Entorno para MTProto -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/buffer/6.0.3/buffer.min.js"></script>
    <script>
        window.Buffer = window.buffer.Buffer;
        window.process = { env: {} };
        window.require = function() { return {}; };
    </script>

    <!-- Librerías Core -->
    <script src="js/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/telegram@2.19.12/browser/telegram.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body class="noir-theme">

    <!-- INTRO ANIMATION (CINEFLIX STYLE) -->
    <div id="cineflix-intro" class="cineflix-intro">
        <div class="noir-container">
            <div class="thunder" id="intro-thunder"></div>
            <div class="rain"></div>
            <div class="logo-container">
                <h1 class="logo-text">PLAYER TV</h1>
                <div class="subtitle">PREMIUM STREAMING</div>
            </div>
            <div id="boot-status" style="position:absolute; bottom:50px; color:#555; font-size:12px;">Iniciando protocolos...</div>
        </div>
    </div>

    <div id="app">
        <!-- VISTA: LOGIN -->
        <div id="view-login" class="view" style="display:none;">
            <div class="login-container">
                <h1 class="login-title">PLAYER TV</h1>
                <p class="login-subtitle">Conecta tu cuenta de Telegram</p>

                <div id="qr-section" class="login-step active">
                    <div id="qr-canvas" class="qr-container">
                        <div id="qr-code"></div>
                        <div id="qr-loading">Generando código...</div>
                    </div>
                    <p class="hint">Abre Telegram > Ajustes > Dispositivos > Escanear QR</p>

                    <div class="divider"><span>O USA TU NÚMERO</span></div>

                    <div class="input-row">
                        <input type="tel" id="input-phone" placeholder="+34 600 000 000" value="+34">
                        <button id="btn-phone" class="btn-primary">Enviar</button>
                    </div>
                </div>

                <div id="step-otp" class="login-step">
                    <label>Código de Verificación</label>
                    <div class="input-row">
                        <input type="text" id="input-otp" placeholder="12345" maxlength="5">
                        <button id="btn-otp" class="btn-primary">Entrar</button>
                    </div>
                </div>

                <div id="step-2fa" class="login-step">
                    <label>Contraseña Cloud (2FA)</label>
                    <div class="input-row">
                        <input type="password" id="input-2fa" placeholder="Tu contraseña">
                        <button id="btn-2fa" class="btn-primary">Verificar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- VISTA: CATÁLOGO -->
        <div id="view-catalog" class="view" style="display:none;">
            <header class="topbar">
                <h1 class="topbar-title">PLAYER TV</h1>
                <div class="topbar-search">
                    <input type="text" id="search-input" placeholder="🔍 Buscar..." onkeyup="ejecutarBuscador()">
                </div>
            </header>

            <nav class="main-nav">
                <button class="nav-btn active" onclick="cambiarFiltro('inicio', this)">INICIO</button>
                <button class="nav-btn" onclick="cambiarFiltro('peliculas', this)">PELÍCULAS</button>
                <button class="nav-btn" onclick="cambiarFiltro('series', this)">SERIES</button>
                <button class="nav-btn" onclick="cambiarFiltro('agenda', this)">DEPORTES</button>
            </nav>

            <div id="netflix-content">
                <div id="catalog-hero" class="hero-section"></div>
                <div id="catalog-rows"></div>
            </div>
        </div>
    </div>

    <!-- REPRODUCTOR -->
    <div id="player-layer" style="display:none;">
        <button class="btn-close-player" onclick="cerrarReproductor()">✕</button>
        <video id="video-player" controls autoplay></video>
    </div>

    <script src="js/main.js"></script>
    <script src="js/telegram-client.js"></script>
</body>
</html>
