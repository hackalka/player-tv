<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PLAYER TV - Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --netflix-red: #E50914; --bg-black: #141414; }
        body { background: var(--bg-black); color: white; font-family: 'Helvetica Neue', Helvetica, sans-serif; margin: 0; overflow-x: hidden; }
        .header { position: fixed; top: 0; width: 100%; padding: 20px 5%; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); z-index: 1000; }
        .logo { color: var(--netflix-red); font-size: 32px; font-weight: 900; letter-spacing: 2px; text-decoration: none; }

        .hero { height: 85vh; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 0 5% 100px; position: relative; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg-black) 0%, transparent 50%), linear-gradient(to right, rgba(0,0,0,0.8) 0%, transparent 100%); }
        .hero-content { position: relative; z-index: 10; max-width: 700px; }
        .hero-title { font-size: 4rem; margin: 0; font-weight: 800; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .hero-desc { font-size: 1.2rem; color: #ccc; margin: 20px 0; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .row { margin: 40px 0; padding-left: 5%; }
        .row-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; color: #e5e5e5; }
        .carousel { display: flex; overflow-x: auto; gap: 10px; scrollbar-width: none; padding: 10px 0; }
        .carousel::-webkit-scrollbar { display: none; }

        .card { flex: 0 0 170px; height: 250px; background: #1a1a1a; border-radius: 4px; transition: transform 0.3s, border 0.2s; cursor: pointer; border: 2px solid transparent; overflow: hidden; position: relative; }
        .card:hover { transform: scale(1.08); border-color: #fff; z-index: 10; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-label { position: absolute; bottom: 0; width: 100%; padding: 10px; background: rgba(0,0,0,0.7); font-size: 11px; text-align: center; }

        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.98); z-index:50000; padding: 50px 5%; overflow-y: auto; }
        .modal-grid { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
        .modal-poster { width: 280px; height: 420px; border-radius: 8px; object-fit: cover; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
        .btn-play { background: white; color: black; border: none; padding: 12px 35px; border-radius: 4px; font-weight: 800; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; margin: 10px 0; }
        .btn-vlc { background: #f5c518; color: black; border: none; padding: 12px 35px; border-radius: 4px; font-weight: 800; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }

        #player-layer { display: none; position: fixed; inset: 0; background: #000; z-index: 100000; flex-direction: column; align-items: center; justify-content: center; }
        .btn-back { position: absolute; top: 30px; left: 30px; background: var(--netflix-red); color: white; border: none; padding: 12px 25px; border-radius: 4px; font-weight: bold; cursor: pointer; z-index: 100; }

        @media (max-width: 768px) { .hero-title { font-size: 2.5rem; } :root { --card-w: 130px; } }
    </style>
</head>
<body>

    <header class="header"><a href="#" class="logo">PLAYER TV</a></header>

    <div id="hero" class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 id="hero-title" class="hero-title">Sincronizando...</h1>
            <p id="hero-desc" class="hero-desc"></p>
            <div id="hero-actions"></div>
        </div>
    </div>

    <div id="catalog-container"></div>

    <div id="detail-modal" class="modal">
        <button onclick="cerrarModal()" style="position:absolute; top:30px; right:30px; background:none; border:none; color:white; font-size:40px; cursor:pointer;">✕</button>
        <div class="modal-grid">
            <img id="modal-img" class="modal-poster">
            <div class="modal-info" style="flex:1; min-width:320px; max-width:800px;">
                <h1 id="modal-title" style="font-size: 3.5rem; margin-top:0;"></h1>
                <p id="modal-desc" style="font-size:1.2rem; color:#aaa; line-height:1.6; margin-bottom:40px;"></p>
                <div id="modal-links"></div>
            </div>
        </div>
    </div>

    <div id="player-layer">
        <button class="btn-back" onclick="cerrarPlayer()">← VOLVER</button>
        <video id="main-video" controls autoplay style="width:100%; height:100%;"></video>
    </div>

    <script>
        const API_URL = "https://player-tv-a8f4.onrender.com";

        async function init() {
            try {
                const res = await fetch(`${API_URL}/api/catalogo`);
                const data = await res.json();
                render(data);
            } catch (e) { console.error(e); }
        }

        function render(data) {
            const container = document.getElementById('catalog-container');
            container.innerHTML = '';

            const sections = [
                { id: 'peliculas', label: 'PELÍCULAS' },
                { id: 'series', label: 'SERIES' },
                { id: 'deportes', label: 'DEPORTES EN VIVO' }
            ];

            sections.forEach(sec => {
                const items = data[sec.id];
                if (items && items.length > 0) {
                    const row = document.createElement('div');
                    row.className = 'row';
                    row.innerHTML = `<div class="row-title">${sec.label}</div><div class="carousel"></div>`;
                    const carousel = row.querySelector('.carousel');
                    items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        const img = item.portada ? API_URL + item.portada : 'https://via.placeholder.com/170x250/111/f5c518?text=TV';
                        card.innerHTML = `<img src="${img}"><div class="card-label">${item.titulo}</div>`;
                        card.onclick = () => showDetail(item);
                        carousel.appendChild(card);
                    });
                    container.appendChild(row);
                }
            });

            if (data.peliculas.length) {
                const h = data.peliculas[0];
                document.getElementById('hero-title').innerText = h.titulo;
                document.getElementById('hero-desc').innerText = h.sinopsis;
                document.getElementById('hero').style.backgroundImage = `url('${API_URL}${h.portada}')`;
                renderButtons(document.getElementById('hero-actions'), h.links);
            }
        }

        function showDetail(item) {
            document.getElementById('modal-title').innerText = item.titulo;
            document.getElementById('modal-desc').innerText = item.sinopsis;
            document.getElementById('modal-img').src = item.portada ? API_URL + item.portada : 'https://via.placeholder.com/300x450/111/f5c518?text=TV';
            renderButtons(document.getElementById('modal-links'), item.links);
            document.getElementById('detail-modal').style.display = 'block';
        }

        function renderButtons(container, links) {
            container.innerHTML = '';
            links.forEach(l => {
                const streamUrl = `${API_URL}/api/stream/${l.id}`;

                const playBtn = document.createElement('button');
                playBtn.className = 'btn-play';
                playBtn.innerHTML = `<i class="fa fa-play"></i> REPRODUCIR`;
                playBtn.onclick = (e) => { e.stopPropagation(); play(streamUrl); };
                container.appendChild(playBtn);

                const vlcBtn = document.createElement('button');
                vlcBtn.className = 'btn-vlc';
                vlcBtn.innerHTML = `<i class="fa fa-external-link-alt"></i> VLC / EXTERNO`;
                vlcBtn.onclick = (e) => {
                    e.stopPropagation();
                    // Intent nativo de Android para VLC
                    window.location.href = `intent:${streamUrl}#Intent;type=video/*;package=org.videolan.vlc;S.title=Reproduciendo;end`;
                };
                container.appendChild(vlcBtn);
            });
        }

        function play(url) {
            document.getElementById('player-layer').style.display = 'flex';
            document.getElementById('main-video').src = url;
        }

        function cerrarModal() { document.getElementById('detail-modal').style.display = 'none'; }
        function cerrarPlayer() {
            const video = document.getElementById('main-video');
            video.pause(); video.src = "";
            document.getElementById('player-layer').style.display = 'none';
        }

        init();
    </script>
</body>
</html>
