<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PLAYER TV - Estilo Netflix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reproductor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --netflix-red: #E50914; --bg-black: #141414; }
        body { background: var(--bg-black); color: white; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; }
        .hero { height: 70vh; background: linear-gradient(to top, var(--bg-black), transparent), url('https://via.placeholder.com/1200x800/111/f5c518?text=PLAYER+TV') center/cover; display: flex; align-items: flex-end; padding: 50px; }
        .row { padding: 20px 0 20px 50px; }
        .row-title { font-size: 1.4rem; font-weight: bold; margin-bottom: 10px; }
        .carousel { display: flex; overflow-x: scroll; gap: 10px; scrollbar-width: none; }
        .card { flex: 0 0 200px; height: 300px; background: #222; border-radius: 4px; transition: transform 0.3s; cursor: pointer; }
        .card:hover { transform: scale(1.05); z-index: 10; }
        .card img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <header style="position: fixed; top: 0; width: 100%; padding: 20px 50px; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); z-index: 1000;">
        <h1 style="color: var(--netflix-red); margin: 0; font-size: 30px;">PLAYER TV</h1>
    </header>

    <div id="hero" class="hero">
        <div>
            <h1 id="hero-title" style="font-size: 3rem; margin: 0;">Cargando...</h1>
            <p id="hero-desc" style="max-width: 600px; font-size: 1.2rem;">Conectando con el catálogo de Telegram...</p>
        </div>
    </div>

    <div id="content"></div>

    <!-- REPRODUCTOR -->
    <div id="player-layer" style="display:none; position:fixed; inset:0; background:#000; z-index: 10000; flex-direction:column; align-items:center; justify-content:center;">
        <button onclick="cerrar()" style="position:absolute; top:20px; left:20px; background:var(--netflix-red); color:white; border:none; padding:15px; border-radius:4px; font-weight:bold; cursor:pointer;">← VOLVER</button>
        <video id="main-video" controls style="width:100%; max-height:90vh;"></video>
    </div>

    <script>
        const API_URL = "https://tu-servidor-node.up.railway.app"; // 👈 AQUÍ PONDRÁS TU URL DEL BACKEND

        async function cargar() {
            try {
                const res = await fetch(`${API_URL}/api/catalogo`);
                const data = await res.json();
                render(data);
            } catch (e) {
                console.error("Error cargando API:", e);
                document.getElementById('hero-title').innerText = "Servidor Desconectado";
            }
        }

        function render(items) {
            const container = document.getElementById('content');
            container.innerHTML = '';

            // Agrupar por categorías (Peliculas, Series, etc)
            const cats = ['peliculas', 'series', 'otros'];
            cats.forEach(c => {
                const filtrados = items.filter(i => i.categoria === c);
                if (filtrados.length > 0) {
                    const row = document.createElement('div');
                    row.className = 'row';
                    row.innerHTML = `<div class="row-title">${c.toUpperCase()}</div><div class="carousel" id="row-${c}"></div>`;
                    container.appendChild(row);

                    const carousel = document.getElementById(`row-${c}`);
                    filtrados.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `<img src="https://via.placeholder.com/200x300/111/f5c518?text=${item.titulo}">`;
                        card.onclick = () => reproducir(item.id);
                        carousel.appendChild(card);
                    });
                }
            });

            if (items[0]) {
                document.getElementById('hero-title').innerText = items[0].titulo;
                document.getElementById('hero-desc').innerText = items[0].sinopsis.substring(0, 200) + "...";
            }
        }

        function reproducir(id) {
            const player = document.getElementById('player-layer');
            const video = document.getElementById('main-video');
            player.style.display = 'flex';
            video.src = `${API_URL}/api/stream/${id}`;
            video.play();
        }

        function cerrar() {
            const video = document.getElementById('main-video');
            video.pause();
            document.getElementById('player-layer').style.display = 'none';
        }

        cargar();
    </script>
</body>
</html>
