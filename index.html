<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PLAYER TV - Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --red: #E50914; --bg: #141414; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; overflow-x: hidden; }
        .header { position: fixed; top: 0; width: 100%; padding: 20px 5%; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); z-index: 1000; }
        .logo { color: var(--red); font-size: 28px; font-weight: 900; text-decoration: none; letter-spacing: 2px; }

        .hero { height: 80vh; position: relative; display: flex; align-items: flex-end; padding: 0 5% 80px; background-size: cover; background-position: center; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg), transparent 50%), linear-gradient(to right, rgba(0,0,0,0.7), transparent); }
        .hero-content { position: relative; z-index: 10; max-width: 600px; }
        .hero-title { font-size: 3.5rem; margin: 0; font-weight: 900; }
        .hero-desc { font-size: 1.1rem; color: #ccc; margin: 20px 0; line-height: 1.5; }

        .row { margin: 30px 0; padding-left: 5%; }
        .row-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; }
        .carousel { display: flex; overflow-x: auto; gap: 12px; scrollbar-width: none; padding: 10px 0; }
        .carousel::-webkit-scrollbar { display: none; }

        .card { flex: 0 0 160px; height: 240px; background: #222; border-radius: 6px; transition: transform 0.3s; cursor: pointer; border: 1px solid #333; position: relative; overflow: hidden; }
        .card:hover { transform: scale(1.08); z-index: 10; border-color: #fff; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-label { position: absolute; bottom: 0; width: 100%; padding: 10px; background: rgba(0,0,0,0.8); font-size: 11px; text-align: center; }

        /* FICHA DETALLE */
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:50000; padding: 60px 5%; overflow-y: auto; }
        .modal-grid { display: flex; gap: 40px; flex-wrap: wrap; }
        .modal-poster { width: 250px; height: 380px; border-radius: 10px; object-fit: cover; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .modal-info { flex: 1; min-width: 300px; }
        .btn-play { background: white; color: black; border: none; padding: 12px 30px; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; margin: 10px 0; width: fit-content; }
        .btn-play:hover { background: #e6e6e6; }
        .btn-close { position: absolute; top: 30px; right: 30px; background: none; border: none; color: white; font-size: 30px; cursor: pointer; }

        #player-layer { display: none; position: fixed; inset: 0; background: #000; z-index: 100000; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <header class="header"><a href="#" class="logo">PLAYER TV</a></header>

    <div id="hero" class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 id="hero-title" class="hero-title">Cargando...</h1>
            <p id="hero-desc" class="hero-desc"></p>
            <div id="hero-actions"></div>
        </div>
    </div>

    <div id="catalog"></div>

    <div id="detail-modal" class="modal">
        <button class="btn-close" onclick="cerrarModal()">✕</button>
        <div class="modal-grid">
            <img id="modal-img" class="modal-poster">
            <div class="modal-info">
                <h1 id="modal-title" style="font-size: 3rem; margin-top: 0;"></h1>
                <p id="modal-desc" style="font-size: 1.2rem; color: #aaa; margin-bottom: 30px;"></p>
                <div id="modal-links"></div>
            </div>
        </div>
    </div>

    <div id="player-layer">
        <button onclick="cerrarPlayer()" style="position:absolute; top:20px; left:20px; background:var(--red); color:white; border:none; padding:15px 25px; border-radius:5px; font-weight:bold; cursor:pointer; z-index:10;">← VOLVER</button>
        <video id="main-video" controls autoplay style="width: 100%; height: 100%;"></video>
    </div>

    <script>
        const API_URL = "https://player-tv-a8f4.onrender.com";

        async function init() {
            try {
                document.getElementById('catalog').innerHTML = '<div style="text-align:center; padding:100px; color:#f5c518; font-size:20px;"><i class="fa fa-circle-notch fa-spin"></i> PREPARANDO CATÁLOGO...</div>';
                const res = await fetch(`${API_URL}/api/catalogo`);
                const data = await res.json();
                document.getElementById('catalog').innerHTML = '';

                // Hero dinámico
                const top = data.peliculas[0] || data.series[0];
                if (top) {
                    document.getElementById('hero-title').innerText = top.titulo;
                    document.getElementById('hero-desc').innerText = top.sinopsis.substring(0, 150) + "...";
                    document.getElementById('hero').style.backgroundImage = `url('${API_URL}${top.portada}')`;
                    renderButtons(document.getElementById('hero-actions'), top.links);
                }

                renderRow("PELÍCULAS", data.peliculas);
                renderRow("SERIES", data.series);
                renderRow("DEPORTES", data.deportes);
            } catch (e) { console.error(e); }
        }

        function renderRow(title, items) {
            if (!items.length) return;
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `<div class="row-title">${title}</div><div class="carousel"></div>`;
            const carousel = row.querySelector('.carousel');

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                const img = item.portada ? API_URL + item.portada : 'https://via.placeholder.com/160x240/111/f5c518?text=NO+IMAGE';
                card.innerHTML = `<img src="${img}"><div class="card-label">${item.titulo}</div>`;
                card.onclick = () => showDetail(item);
                carousel.appendChild(card);
            });
            document.getElementById('catalog').appendChild(row);
        }

        function showDetail(item) {
            document.getElementById('modal-title').innerText = item.titulo;
            document.getElementById('modal-desc').innerText = item.sinopsis;
            document.getElementById('modal-img').src = item.portada ? API_URL + item.portada : '';
            renderButtons(document.getElementById('modal-links'), item.links);
            document.getElementById('detail-modal').style.display = 'block';
        }

        function renderButtons(container, links) {
            container.innerHTML = '';
            links.forEach(l => {
                const b = document.createElement('button');
                b.className = 'btn-play';
                b.innerHTML = `<i class="fa fa-play"></i> ${l.label}`;
                b.onclick = (e) => { e.stopPropagation(); play(l.id); };
                container.appendChild(b);
            });
        }

        function play(id) {
            const video = document.getElementById('main-video');
            document.getElementById('player-layer').style.display = 'flex';
            video.src = `${API_URL}/api/stream/${id}`;
        }

        function cerrarModal() { document.getElementById('detail-modal').style.display = 'none'; }
        function cerrarPlayer() {
            const v = document.getElementById('main-video');
            v.pause(); v.src = "";
            document.getElementById('player-layer').style.display = 'none';
        }

        init();
    </script>
</body>
</html>
