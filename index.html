<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PLAYER TV - Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="css/reproductor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Script oficial de Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Firebase v10 (Modular ES Modules) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: atob("aHR0cHM6Ly9wbGF5ZXJ0di05NDQ5Yy1kZWZhdWx0LXJ0ZGIuZXVyb3BlLXdlc3QxLmZpcmViYXNlZGF0YWJhc2UuYXBwLw==")
        };

        const app = initializeApp(firebaseConfig);
        window.db = getDatabase(app);
        window.dbRef = ref;
        window.dbOnValue = onValue;

        console.log("✅ Firebase v10 Conectado");
        // Iniciamos la carga una vez Firebase está listo
        if (window.initApp) window.initApp();
    </script>
</head>
<body style="background: #000; color: #fff; margin: 0; font-family: sans-serif;">

    <header style="padding: 20px; text-align: center; border-bottom: 1px solid #222;">
        <h1 style="color: #f5c518; margin: 0; font-size: 24px; letter-spacing: 2px;">PLAYER TV</h1>
    </header>

    <nav class="nav" style="display: flex; justify-content: center; gap: 15px; padding: 15px;">
        <button class="f-btn active" onclick="cambiarFiltro('inicio', this)">INICIO</button>
        <button class="f-btn" onclick="cambiarFiltro('peliculas', this)">PELÍCULAS</button>
        <button class="f-btn" onclick="cambiarFiltro('series', this)">SERIES</button>
        <button class="f-btn" onclick="cambiarFiltro('agenda', this)">DEPORTES</button>
    </nav>

    <div id="content" style="padding: 10px;">
        <div id="loading" style="text-align:center; padding:50px; color:#666;">Cargando contenidos...</div>
    </div>

    <!-- REPRODUCTOR -->
    <div id="player-layer" style="display:none; position:fixed; inset:0; background:#000; z-index: 20000; flex-direction:column; align-items:center; justify-content:center;">
        <button onclick="cerrarReproductor()" style="position:absolute; top:20px; left:20px; background:#f44336; color:white; border:none; padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer;">VOLVER</button>
        <h2 id="video-info" style="color:#fff; margin-bottom:10px;"></h2>
        <video id="main-video" controls style="width:100%; max-height:80vh;"></video>
    </div>

    <!-- Lógica de la Aplicación -->
    <script src="js/main.js"></script>
    <!-- Ya no cargamos telegram-client.js porque eliminamos GramJS -->
</body>
</html>
