<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PLAYER TV - Premium Netflix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --red: #E50914; --bg: #141414; }
        body { background: var(--bg); color: white; font-family: 'Helvetica Neue', Helvetica, sans-serif; margin: 0; overflow-x: hidden; }

        .header { position: fixed; top: 0; width: 100%; padding: 20px 4%; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); z-index: 1000; }
        .logo { color: var(--red); font-size: 30px; font-weight: 900; letter-spacing: 2px; text-decoration: none; }

        .hero { height: 85vh; position: relative; display: flex; align-items: flex-end; padding: 0 4% 100px; background-size: cover; background-position: center; transition: background 0.5s; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(77deg, rgba(0,0,0,0.8) 0, transparent 85%), linear-gradient(0deg, var(--bg) 0, transparent 40%); }
        .hero-content { position: relative; z-index: 5; max-width: 700px; }
        .hero-title { font-size: 4rem; margin: 0 0 10px; font-weight: bold; }
        .hero-desc { font-size: 1.2rem; line-height: 1.4; margin-bottom: 25px; color: #ccc; text-shadow: 1px 1px 2px #000; }

        .row { margin: 20px 0; padding-left: 4%; }
        .row-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; }
        .carousel { display: flex; overflow-x: auto; gap: 10px; scrollbar-width: none; padding: 10px 0; }
        .carousel::-webkit-scrollbar { display: none; }

        .card { flex: 0 0 180px; height: 260px; background: #222; border-radius: 4px; transition: transform 0.3s; cursor: pointer; position: relative; }
        .card:hover { transform: scale(1.1); z-index: 10; outline: 2px solid white; }
        .card img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }

        /* Modal de Episodios */
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:20000; overflow-y:auto; padding: 50px 10%; }
        .ep-list { display: grid; gap: 10px; margin-top: 20px; }
        .ep-item { background: #333; padding: 15px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; }
        .ep-item:hover { background: #444; }

        #player-layer { display: none; position: fixed; inset: 0; background: #000; z-index: 30000; align-items: center; justify-content: center; }
        .btn-close { position: absolute; top: 30px; left: 30px; background: var(--red); color: white; border: none; padding: 12px 25px; border-radius: 4px; font-weight: bold; cursor: pointer; z-index: 100; }
    </style>
</head>
<body>

    <header class="header"><a href="#" class="logo">PLAYER TV</a></header>

    <div id="hero" class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 id="hero-title" class="hero-title">Iniciando...</h1>
            <p id="hero-desc" class="hero-desc"></p>
            <button id="hero-btn" class="ep-item" style="background:white; color:black; font-weight:bold; width:200px; justify-content:center;">▶ Reproducir</button>
        </div>
    </div>

    <div id="catalog"></div>

    <div id="ep-modal" class="modal">
        <button class="btn-close" onclick="cerrarModal()">✕ CERRAR</button>
        <h1 id="modal-title"></h1>
        <div id="modal-list" class="ep-list"></div>
    </div>

    <div id="player-layer">
        <button class="btn-close" onclick="cerrarPlayer()">✕ SALIR</button>
        <video id="main-video" controls autoplay style="width: 100%; height: 100%;"></video>
    </div>

    <script>
        const API_URL = "https://player-tv-a8f4.onrender.com";

        async function init() {
            const res = await fetch(`${API_URL}/api/catalogo`);
            const data = await res.json();

            // Hero
            if(data.peliculas.length) {
                const h = data.peliculas[0];
                document.getElementById('hero-title').innerText = h.titulo;
                document.getElementById('hero-desc').innerText = h.sinopsis;
                document.getElementById('hero').style.backgroundImage = `url('${API_URL}${h.portada}')`;
                document.getElementById('hero-btn').onclick = () => play(h.id);
            }

            renderRow("PELÍCULAS", data.peliculas, false);
            renderRow("SERIES UNIFICADAS", data.series, true);
            renderRow("DEPORTES", data.deportes, false);
        }

        function renderRow(title, items, isSeries) {
            if(!items.length) return;
            const container = document.getElementById('catalog');
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `<div class="row-title">${title}</div><div class="carousel"></div>`;
            const carousel = row.querySelector('.carousel');

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                const img = item.portada ? (item.portada.startsWith('/') ? API_URL+item.portada : item.portada) : 'https://via.placeholder.com/180x260/111/f5c518?text=TV';
                card.innerHTML = `<img src="${img}">`;
                card.onclick = () => isSeries ? showEpisodes(item) : play(item.id);
                carousel.appendChild(card);
            });
            container.appendChild(row);
        }

        function showEpisodes(serie) {
            document.getElementById('modal-title').innerText = serie.titulo;
            const list = document.getElementById('modal-list');
            list.innerHTML = '';
            serie.episodios.forEach(ep => {
                const div = document.createElement('div');
                div.className = 'ep-item';
                div.innerHTML = `<span>${ep.titulo}</span> <i class="fa fa-play"></i>`;
                div.onclick = () => play(ep.id);
                list.appendChild(div);
            });
            document.getElementById('ep-modal').style.display = 'block';
        }

        function play(id) {
            const layer = document.getElementById('player-layer');
            const video = document.getElementById('main-video');
            layer.style.display = 'flex';
            video.src = `${API_URL}/api/stream/${id}`;
        }

        function cerrarModal() { document.getElementById('ep-modal').style.display = 'none'; }
        function cerrarPlayer() {
            const video = document.getElementById('main-video');
            video.pause(); video.src = "";
            document.getElementById('player-layer').style.display = 'none';
        }

        init();
    </script>
</body>
</html>
