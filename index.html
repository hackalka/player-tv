<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cliente Telegram TV con estilo Netflix">
    <title>Player TV</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23f5c518' width='100' height='100'/><text x='50' y='65' font-size='60' font-weight='bold' text-anchor='middle' fill='%23000'>TV</text></svg>">
    <link rel="stylesheet" href="style.css">
    <!-- SafeStorage para Firefox Tracking Prevention -->
    <script>
        const SafeStorage = (() => {
            let memoryStore = {};
            let storageAvailable = false;
            try {
                const test = '__storage_test__';
                localStorage.setItem(test, test);
                localStorage.removeItem(test);
                storageAvailable = true;
            } catch (e) {
                console.warn('localStorage bloqueado. Usando memoria.');
            }
            return {
                getItem(key) {
                    try {
                        return storageAvailable ? localStorage.getItem(key) : memoryStore[key] || null;
                    } catch {
                        return memoryStore[key] || null;
                    }
                },
                setItem(key, value) {
                    try {
                        if (storageAvailable) localStorage.setItem(key, value);
                    } catch {}
                    memoryStore[key] = value;
                }
            };
        })();
    </script>

    <!-- Motor Telegram & QR -->
    <script src="https://cdn.jsdelivr.net/npm/telegram/browser/telegram.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Netflix+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Fallback a Helvetica Neue que usa Netflix -->
    <style>
        body { font-family: 'Netflix Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    </style>
</head>
<body>
    <!-- Navbar Netflix-style -->
    <nav class="navbar">
        <div class="navbar-left">
            <a href="#" class="logo">
                <img src="logo192.png" alt="Player TV" height="32">
            </a>
            <ul class="nav-links">
                <li><a href="#" class="active">Inicio</a></li>
                <li><a href="#series">Series</a></li>
                <li><a href="#peliculas">Películas</a></li>
                <li><a href="#mi-lista">Mi Lista</a></li>
            </ul>
        </div>
        <div class="navbar-right">
            <button class="search-btn" aria-label="Buscar">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M21.71 20.29L18 16.61A9 9 0 1 0 16.61 18l3.68 3.68a1 1 0 0 0 1.42 0 1 1 0 0 0 0-1.39zM11 18a7 7 0 1 1 7-7 7 7 0 0 1-7 7z"/>
                </svg>
            </button>
            <button class="admin-btn" id="admin-btn" aria-label="Administrar grupos" style="display:none;">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.49.49 0 0 0-.48-.41h-3.84a.49.49 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94 0 .32.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.13.22.39.3.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.46 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
                </svg>
            </button>
            <div class="profile-dropdown">
                <img src="logo512.png" alt="Perfil" class="profile-avatar">
            </div>
        </div>
    </nav>
    <!-- Hero Banner (Billboard) -->
    <section class="hero" id="hero">
        <div class="hero-background">
            <img src="" alt="" class="hero-image" id="hero-image">
            <div class="hero-gradient"></div>
        </div>
        <div class="hero-content">
            <h1 class="hero-title" id="hero-title"></h1>
            <p class="hero-description" id="hero-description"></p>
            <div class="hero-buttons">
                <button class="btn btn-play" id="hero-play">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M8 5v14l11-7z"/>
                    </svg>
                    Reproducir
                </button>
                <button class="btn btn-info" id="hero-info">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                    </svg>
                    Más información
                </button>
            </div>
        </div>
    </section>
    <!-- Contenido principal con filas -->
    <main class="main-content">
        <!-- Las filas se generan dinámicamente -->
        <div class="rows-container" id="rows-container"></div>
    </main>

    <!-- Modal de Administracion (solo propietario) -->
    <div class="modal" id="admin-modal" hidden>
        <div class="modal-overlay"></div>
        <div class="modal-content admin-box">
            <button class="modal-close" id="admin-close" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
            <h2 class="modal-title">Administrar grupos</h2>
            <p id="admin-whoami" class="admin-whoami"></p>

            <label class="admin-label" for="admin-target">Grupo destino (a donde se reenvia)</label>
            <input type="text" id="admin-target" class="admin-input" placeholder="@migrupo o id del grupo">

            <div class="admin-toolbar">
                <span class="admin-label">Tus grupos suscritos (marca los que quieras usar como fuente)</span>
                <button class="btn-sm" id="admin-reload">Recargar</button>
            </div>
            <div class="admin-group-list" id="admin-group-list">
                <p class="admin-hint">Pulsa "Recargar" para ver tus grupos.</p>
            </div>

            <div class="admin-footer">
                <span id="admin-status" class="admin-status"></span>
                <button class="btn btn-play" id="admin-save">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Login Telegram -->
    <div class="modal" id="login-modal" hidden>
        <div class="modal-overlay"></div>
        <div class="modal-content login-box">
            <h2 class="modal-title">Acceder a Telegram</h2>
            <p style="color: var(--netflix-light-gray); margin-bottom: 20px;">Escanea el código QR con tu móvil (Ajustes > Dispositivos > Vincular dispositivo)</p>
            <div id="qr-loading" class="loader" style="margin: 20px auto;"></div>
            <div id="qr-code" style="background: white; padding: 10px; display: inline-block; border-radius: 4px;"></div>
            <p id="boot-status" style="margin-top: 20px; font-weight: bold; color: var(--netflix-red);"></p>
        </div>
    </div>

    <!-- Modal de reproducción -->
    <div class="modal" id="player-modal" hidden>
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
            <div class="player-wrapper">
                <iframe id="player-iframe" allowfullscreen></iframe>
            </div>
            <div class="modal-details" id="modal-details">
                <h2 class="modal-title" id="modal-title"></h2>
                <div class="modal-meta">
                    <span class="match" id="modal-match">98% coincidencia</span>
                    <span class="year" id="modal-year"></span>
                    <span class="duration" id="modal-duration"></span>
                    <span class="quality">HD</span>
                </div>
                <p class="modal-description" id="modal-description"></p>
            </div>
        </div>
    </div>
    <!-- Búsqueda -->
    <div class="search-overlay" id="search-overlay" hidden>
        <div class="search-container">
            <input type="search" id="search-input" placeholder="Títulos, personas, géneros" autocomplete="off">
            <button class="search-close" aria-label="Cerrar búsqueda">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>
        <div class="search-results" id="search-results"></div>
    </div>
    <!-- Loading -->
    <div class="loading-screen" id="loading-screen">
        <div class="loader"></div>
    </div>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
