<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PLAYER TV - Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --accent: #f5c518; --bg: #0a0a0a; --surface: #1a1a1a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; overflow-x: hidden; }

        .header { position: fixed; top: 0; width: 100%; padding: 20px 5%; background: rgba(0,0,0,0.9); z-index: 1000; border-bottom: 1px solid #222; }
        .logo { color: var(--accent); font-size: 26px; font-weight: 900; letter-spacing: 2px; text-decoration: none; }

        .catalog { padding-top: 100px; }
        .row { margin: 30px 0; padding-left: 5%; }
        .row-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; color: #ddd; letter-spacing: 1px; }
        .carousel { display: flex; overflow-x: auto; gap: 12px; scrollbar-width: none; padding: 10px 0; }

        .card { flex: 0 0 160px; height: 240px; background: var(--surface); border-radius: 8px; cursor: pointer; border: 1px solid #333; position: relative; overflow: hidden; transition: 0.3s; }
        .card:hover { transform: scale(1.05); border-color: var(--accent); }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-title { position: absolute; bottom: 0; width: 100%; padding: 10px; background: linear-gradient(to top, #000, transparent); font-size: 10px; text-align: center; }

        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:50000; padding: 5%; overflow-y: auto; }
        .modal-content { max-width: 900px; margin: 0 auto; display: flex; gap: 40px; flex-wrap: wrap; }
        .modal-poster { width: 250px; height: 380px; border-radius: 12px; object-fit: cover; box-shadow: 0 0 40px rgba(0,0,0,0.5); border: 1px solid #333; }
        .modal-info { flex: 1; min-width: 300px; }

        .btn-play { background: white; color: black; border: none; padding: 15px 30px; border-radius: 6px; font-weight: 800; cursor: pointer; width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-open-with { background: var(--accent); color: black; border: none; padding: 8px 15px; border-radius: 4px; font-weight: 900; cursor: pointer; font-size: 11px; }

        #player-layer { display: none; position: fixed; inset: 0; background: #000; z-index: 100000; flex-direction: column; align-items: center; justify-content: center; }
        .btn-back { position: absolute; top: 20px; left: 20px; background: #f44336; color: white; border: none; padding: 12px 25px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header class="header"><a href="#" class="logo">PLAYER TV</a></header>

    <div id="catalog" class="catalog">
        <div style="text-align:center; padding:100px; color:var(--accent);">Sincronizando con Telegram...</div>
    </div>

    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <button onclick="cerrarModal()" style="position:absolute; top:20px; right:20px; background:none; border:none; color:white; font-size:30px; cursor:pointer;">✕</button>
            <img id="modal-img" class="modal-poster">
            <div class="modal-info">
                <h1 id="modal-title" style="margin-top:0;"></h1>
                <p id="modal-desc" style="color:#aaa; line-height:1.6; margin-bottom:30px;"></p>
                <div id="modal-links"></div>
            </div>
        </div>
    </div>

    <div id="player-layer">
        <button class="btn-back" onclick="cerrarPlayer()">VOLVER</button>
        <video id="main-video" controls autoplay style="width:100%; max-height:100vh;"></video>
    </div>

    <script>
        const API_URL = "https://player-tv-a8f4.onrender.com";

        async function init() {
            try {
                const res = await fetch(`${API_URL}/api/catalogo`);
                const data = await res.json();
                renderCatalog(data);
            } catch (e) { console.error(e); }
        }

        function renderCatalog(data) {
            const container = document.getElementById('catalog');
            container.innerHTML = '';
            const sections = [
                { id: 'peliculas', label: 'PELÍCULAS' },
                { id: 'series', label: 'SERIES' },
                { id: 'deportes', label: 'DEPORTES EN VIVO' }
            ];

            sections.forEach(sec => {
                const items = data[sec.id];
                if (items && items.length > 0) {
                    const row = document.createElement('div');
                    row.className = 'row';
                    row.innerHTML = `<div class="row-title">${sec.label}</div><div class="carousel"></div>`;
                    const carousel = row.querySelector('.carousel');
                    items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `<img src="${API_URL}${item.portada}"><div class="card-title">${item.titulo}</div>`;
                        card.onclick = () => showDetail(item);
                        carousel.appendChild(card);
                    });
                    container.appendChild(row);
                }
            });
        }

        function showDetail(item) {
            document.getElementById('modal-title').innerText = item.titulo;
            document.getElementById('modal-desc').innerText = item.sinopsis;
            document.getElementById('modal-img').src = API_URL + item.portada;

            const box = document.getElementById('modal-links');
            box.innerHTML = '';
            item.links.forEach(l => {
                const streamUrl = `${API_URL}/api/stream/${l.id}`;
                const div = document.createElement('div');
                div.className = 'btn-play';
                div.innerHTML = `<span>${l.label}</span>
                    <div style="display:flex; gap:10px;">
                        <button onclick="play('${streamUrl}')" style="background:none; border:none; color:blue; font-weight:bold; cursor:pointer;">REPRODUCIR</button>
                        <button class="btn-open-with" onclick="openWith('${streamUrl}', '${item.titulo}')">ABRIR CON...</button>
                    </div>`;
                box.appendChild(div);
            });
            document.getElementById('detail-modal').style.display = 'block';
        }

        function openWith(url, title) {
            // Intent universal de Android para abrir el diálogo "¿Con qué aplicación?"
            const intent = `intent:${url}#Intent;type=video/*;S.title=${encodeURIComponent(title)};end`;
            window.location.href = intent;
        }

        function play(url) {
            document.getElementById('player-layer').style.display = 'flex';
            document.getElementById('main-video').src = url;
        }

        function cerrarModal() { document.getElementById('detail-modal').style.display = 'none'; }
        function cerrarPlayer() { document.getElementById('main-video').pause(); document.getElementById('player-layer').style.display = 'none'; }

        init();
    </script>
</body>
</html>
