<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Player TV - Premium 2026</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#06090e">

    <link rel="stylesheet" href="css/reproductor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <!-- Cargamos Buffer PRIMERO de forma absoluta -->
    <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
    <script>
        // Definición global robusta
        window.Buffer = window.buffer.Buffer;
        window.process = { env: {} };
    </script>

    <!-- Cargamos GramJS después de Buffer -->
    <script src="https://cdn.jsdelivr.net/npm/telegram@2.19.12/browser/telegram.js"></script>
</head>
<body>

<header>
    <div class="logo-box">
        <h1>PLAYER TV</h1>
    </div>
</header>

<div class="search-container">
    <div class="search-bar">
        <i class="fa fa-search"></i>
        <input type="text" id="mainSearch" placeholder="Buscar películas, series, deportes..." onkeyup="ejecutarBuscador()">
    </div>
</div>

<div id="hero-container"></div>

<nav class="nav">
    <button class="f-btn active" onclick="cambiarFiltro('inicio', this)">INICIO</button>
    <button class="f-btn" onclick="cambiarFiltro('agenda', this)">DEPORTES</button>
    <button class="f-btn" onclick="cambiarFiltro('peliculas', this)">PELÍCULAS</button>
    <button class="f-btn" onclick="cambiarFiltro('series', this)">SERIES</button>
    <button class="f-btn" onclick="cambiarFiltro('directos', this)">TV EN VIVO</button>
</nav>

<div id="sub-nav"></div>
<div id="content"></div>

<!-- Modal de Login -->
<div id="login-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index: 10000; align-items:center; justify-content:center;">
    <div style="background:#111; border:2px solid #f5c518; width:90%; max-width:400px; padding:30px; border-radius:15px; text-align:center;">
        <h2 style="color:#f5c518;">TELEGRAM LOGIN</h2>
        <p id="login-msg" style="color:#ccc;">Introduce tu número (+34...)</p>
        <input type="text" id="phone-input" style="width:100%; padding:15px; margin:10px 0; background:#222; border:1px solid #444; color:white; border-radius:8px;">
        <input type="text" id="code-input" style="display:none; width:100%; padding:15px; margin:10px 0; background:#222; border:1px solid #444; color:white; border-radius:8px;" placeholder="Código">
        <input type="password" id="2fa-input" style="display:none; width:100%; padding:15px; margin:10px 0; background:#222; border:1px solid #444; color:white; border-radius:8px;" placeholder="Contraseña 2FA">
        <button onclick="iniciarLogin()" style="width:100%; padding:15px; background:#f5c518; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">CONTINUAR</button>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="cerrarModal()">✕</button>
        <div id="modalHeader"></div>
        <div class="modal-details" style="padding: 20px;">
            <h2 id="det-titulo" style="color:#f5c518;"></h2>
            <p id="det-sinopsis" style="color:#ccc;"></p>
            <div id="tabsTemporadas"></div>
            <div id="linksBox"></div>
        </div>
    </div>
</div>

<div id="player-layer" style="display:none; position:fixed; inset:0; background:#000; z-index:15000; flex-direction:column; align-items:center; justify-content:center;">
    <button onclick="cerrarReproductor()" style="position:absolute; top:20px; left:20px; background:#f44336; color:white; border:none; padding:15px; border-radius:8px; font-weight:bold;">VOLVER</button>
    <h2 id="video-info" style="color:white; margin-bottom:15px;"></h2>
    <video id="main-video" controls style="width:100%; max-height:80vh;"></video>
</div>

<script src="js/main.js"></script>
<script src="js/telegram-client.js"></script>

</body>
</html>
