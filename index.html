<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PLAYER TV - Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="css/reproductor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // CONFIGURACIÓN DE EMERGENCIA PARA EVITAR BLOQUEOS
        window.Buffer = null;
        window.process = { env: {} };
        window.require = function() { return {}; };

        function loadScript(urls, callback) {
            let url = urls.shift();
            let script = document.createElement('script');
            script.src = url;
            script.onload = () => {
                console.log("✅ Cargado:", url);
                if (urls.length > 0) loadScript(urls, callback);
                else callback();
            };
            script.onerror = () => {
                console.warn("❌ Bloqueado:", url);
                document.getElementById('boot-status').innerText = "Saltando bloqueo del navegador...";
                if (urls.length > 0) loadScript(urls, callback);
                else document.getElementById('boot-status').innerHTML = "<span style='color:red;'>ERROR: EL NAVEGADOR BLOQUEA TODO. USA OTRO NAVEGADOR.</span>";
            };
            document.head.appendChild(script);
        }
    </script>
</head>
<body style="background: #000; color: #fff; margin: 0; font-family: sans-serif; overflow-x: hidden;">

    <div id="loader-screen" style="position:fixed; inset:0; background:#000; z-index:200000; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <h1 style="color:#f5c518; font-size:32px; letter-spacing:5px; margin:0;">PLAYER TV</h1>
        <div id="boot-status" style="color:#666; margin-top:20px; font-size:12px; text-transform:uppercase;">Iniciando protocolos...</div>
    </div>

    <header style="padding: 20px; text-align: center; border-bottom: 1px solid #222; background: #000;">
        <h1 style="color: #f5c518; margin: 0; font-size: 22px;">PLAYER TV</h1>
    </header>

    <nav class="nav" style="display: flex; justify-content: center; gap: 10px; padding: 15px; background: #000;">
        <button class="f-btn active" onclick="cambiarFiltro('inicio', this)">INICIO</button>
        <button class="f-btn" onclick="cambiarFiltro('peliculas', this)">PELÍCULAS</button>
        <button class="f-btn" onclick="cambiarFiltro('series', this)">SERIES</button>
    </nav>

    <div id="content" style="padding: 15px;"></div>

    <div id="login-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.98); z-index: 100000; align-items:center; justify-content:center;">
        <div style="background:#111; border:2px solid #f5c518; padding:35px; border-radius:20px; width:90%; max-width:400px; text-align:center;">
            <h2 style="color:#f5c518; margin:0 0 15px;">LOGIN</h2>
            <div id="qr-container" style="background:#fff; width:220px; height:220px; margin:0 auto 20px; padding:10px; border-radius:12px; display:flex; align-items:center; justify-content:center;">
                <div id="qr-code"></div>
                <div id="qr-loading" style="color:#000; font-weight:bold;">QR...</div>
            </div>
            <input type="text" id="phone-input" placeholder="+34..." style="width:100%; padding:14px; margin-bottom:12px; background:#222; border:1px solid #333; color:white; border-radius:10px;">
            <button onclick="iniciarLogin()" style="width:100%; padding:14px; background:#f5c518; border:none; font-weight:bold; border-radius:10px; cursor:pointer; color:#000;">ENTRAR</button>
        </div>
    </div>

    <div id="player-layer" style="display:none; position:fixed; inset:0; background:#000; z-index: 150000; flex-direction:column; align-items:center; justify-content:center;">
        <button onclick="cerrarReproductor()" style="position:absolute; top:20px; left:20px; background:#f44336; color:white; border:none; padding:12px 25px; border-radius:10px; font-weight:bold;">VOLVER</button>
        <video id="main-video" controls style="width:100%; max-height:80vh; background:#000;"></video>
    </div>

    <!-- CARGA DE LIBRERÍAS CON SALTO DE SERVIDOR -->
    <script>
        const bufferURLs = [
            'https://cdnjs.cloudflare.com/ajax/libs/buffer/6.0.3/buffer.min.js',
            'https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js',
            'https://unpkg.com/buffer@6.0.3/index.js'
        ];

        const telegramURLs = [
            'https://cdn.jsdelivr.net/npm/telegram/browser/telegram.js',
            'https://unpkg.com/telegram/browser/telegram.js'
        ];

        loadScript(bufferURLs, () => {
            window.Buffer = window.buffer.Buffer;
            loadScript(telegramURLs, () => {
                loadScript(['js/qrcode.min.js', 'js/main.js', 'js/telegram-client.js'], () => {
                    console.log("🚀 Todas las librerías cargadas");
                });
            });
        });
    </script>

</body>
</html>
