<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Player TV - Telegram Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- Estilos base -->
    <link rel="stylesheet" href="css/reproductor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Librerías de soporte (Buffer es vital para Telegram) -->
    <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
    <script>
        // Configuración global para evitar errores de librerías Node en el navegador
        window.Buffer = window.buffer.Buffer;
        window.process = { env: {} };
        window.require = function() { return {}; };
    </script>

    <!-- Motor de Telegram y Firebase -->
    <script src="https://cdn.jsdelivr.net/npm/telegram@2.19.12/browser/telegram.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

<header>
    <div class="logo-box"><h1>PLAYER TV</h1></div>
</header>

<div class="search-container">
    <div class="search-bar">
        <i class="fa fa-search"></i>
        <input type="text" id="mainSearch" placeholder="Buscar contenido..." onkeyup="ejecutarBuscador()">
    </div>
</div>

<div id="hero-container"></div>

<nav class="nav">
    <button class="f-btn active" onclick="cambiarFiltro('inicio', this)">INICIO</button>
    <button class="f-btn" onclick="cambiarFiltro('agenda', this)">DEPORTES</button>
    <button class="f-btn" onclick="cambiarFiltro('peliculas', this)">PELÍCULAS</button>
    <button class="f-btn" onclick="cambiarFiltro('series', this)">SERIES</button>
    <button class="f-btn" onclick="cambiarFiltro('directos', this)">TV EN VIVO</button>
</nav>

<div id="content"></div>

<!-- MODAL DE LOGIN (CENTRAL) -->
<div id="login-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index: 10000; align-items:center; justify-content:center;">
    <div style="background:#111; border:2px solid #f5c518; width:90%; max-width:400px; padding:40px; border-radius:15px; text-align:center; box-shadow: 0 0 30px rgba(245,197,24,0.3);">
        <h2 style="color:#f5c518; margin-top:0;">CONECTAR TELEGRAM</h2>
        <p id="login-msg" style="color:#ccc; margin-bottom:25px;">Introduce tu teléfono con prefijo</p>

        <input type="text" id="phone-input" placeholder="+34123456789" style="width:100%; padding:15px; margin-bottom:15px; background:#222; border:1px solid #444; color:white; border-radius:8px; font-size:16px;">

        <input type="text" id="code-input" placeholder="Código de Telegram" style="display:none; width:100%; padding:15px; margin-bottom:15px; background:#222; border:1px solid #444; color:white; border-radius:8px; font-size:16px;">

        <input type="password" id="2fa-input" placeholder="Contraseña 2FA" style="display:none; width:100%; padding:15px; margin-bottom:15px; background:#222; border:1px solid #444; color:white; border-radius:8px; font-size:16px;">

        <button id="btn-login" onclick="iniciarLogin()" style="width:100%; padding:15px; background:#f5c518; color:black; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:16px;">ENVIAR</button>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="cerrarModal()">✕</button>
        <div id="modalHeader"></div>
        <div class="modal-details" style="padding: 20px;">
            <h2 id="det-titulo" style="color:#f5c518; margin-top:0;"></h2>
            <p id="det-sinopsis" style="color:#ccc; margin-bottom:20px;"></p>
            <div id="linksBox"></div>
        </div>
    </div>
</div>

<div id="player-layer" style="display:none; position:fixed; inset:0; background:#000; z-index:15000; flex-direction:column; align-items:center; justify-content:center;">
    <button onclick="cerrarReproductor()" style="position:absolute; top:20px; left:20px; background:#f44336; color:white; border:none; padding:12px 25px; border-radius:8px; font-weight:bold; cursor:pointer;">VOLVER</button>
    <h2 id="video-info" style="color:white; margin-bottom:15px; text-align:center;"></h2>
    <video id="main-video" controls style="width:100%; max-height:80vh;"></video>
</div>

<!-- Carga de Scripts en orden -->
<script src="js/main.js"></script>
<script src="js/telegram-client.js"></script>

</body>
</html>
