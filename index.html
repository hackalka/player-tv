<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PLAYER TV - Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --red: #E50914; --bg: #141414; --gold: #f5c518; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; overflow-x: hidden; }
        .header { position: fixed; top: 0; width: 100%; padding: 20px 5%; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); z-index: 1000; }
        .logo { color: var(--red); font-size: 30px; font-weight: 900; text-decoration: none; letter-spacing: 2px; }
        .row { margin: 40px 0; padding-left: 5%; }
        .row-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; }
        .carousel { display: flex; overflow-x: auto; gap: 12px; scrollbar-width: none; padding: 10px 0; }
        .card { flex: 0 0 170px; height: 250px; background: #1a1a1a; border-radius: 6px; cursor: pointer; border: 1px solid transparent; overflow: hidden; position: relative; transition: 0.3s; }
        .card:hover { transform: scale(1.08); border-color: #fff; z-index: 10; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.98); z-index:50000; padding: 50px 5%; overflow-y: auto; }
        .modal-poster { width: 280px; height: 420px; border-radius: 8px; object-fit: cover; }
        .btn-play { background: white; color: black; border: none; padding: 12px 35px; border-radius: 4px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 10px; margin: 5px 0; width: 100%; justify-content: space-between; }
        .btn-vlc { background: var(--gold); color: black; border: none; padding: 5px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; }
        #player-layer { display: none; position: fixed; inset: 0; background: #000; z-index: 100000; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <header class="header"><a href="#" class="logo">PLAYER TV</a></header>
    <div id="hero" style="height:70vh; background-size:cover; background-position:center; display:flex; align-items:flex-end; padding:50px 5%;">
        <div style="max-width:600px; z-index:10;">
            <h1 id="hero-title" style="font-size:3.5rem; margin:0;"></h1>
            <p id="hero-desc" style="color:#ccc; margin:20px 0;"></p>
        </div>
    </div>
    <div id="catalog"></div>

    <div id="detail-modal" class="modal">
        <button onclick="cerrarModal()" style="position:absolute; top:30px; right:30px; background:none; border:none; color:white; font-size:40px; cursor:pointer;">✕</button>
        <div style="display:flex; gap:40px; flex-wrap:wrap; justify-content:center;">
            <img id="modal-img" class="modal-poster">
            <div style="flex:1; min-width:300px; max-width:600px;">
                <h1 id="modal-title" style="margin-top:0;"></h1>
                <p id="modal-desc" style="color:#aaa; line-height:1.6;"></p>
                <div id="modal-links"></div>
            </div>
        </div>
    </div>

    <div id="player-layer">
        <button onclick="cerrarPlayer()" style="position:absolute; top:20px; left:20px; background:var(--red); color:white; border:none; padding:15px 30px; border-radius:6px; font-weight:bold; cursor:pointer;">← VOLVER</button>
        <video id="main-video" controls autoplay style="width:100%; max-height:100vh;"></video>
    </div>

    <script>
        const API_URL = "https://player-tv-a8f4.onrender.com";

        async function init() {
            const res = await fetch(`${API_URL}/api/catalogo`);
            const data = await res.json();

            const top = data.peliculas[0] || data.series[0];
            if (top) {
                document.getElementById('hero-title').innerText = top.titulo;
                document.getElementById('hero-desc').innerText = top.sinopsis.substring(0, 150);
                document.getElementById('hero').style.backgroundImage = `linear-gradient(transparent, #141414), url('${API_URL}${top.portada}')`;
            }

            renderRow("PELÍCULAS", data.peliculas);
            renderRow("SERIES", data.series);
            renderRow("DEPORTES", data.deportes);
        }

        function renderRow(title, items) {
            if (!items.length) return;
            const container = document.getElementById('catalog');
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `<div class="row-title">${title}</div><div class="carousel"></div>`;
            const carousel = row.querySelector('.carousel');
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${API_URL}${item.portada}">`;
                card.onclick = () => showDetail(item);
                carousel.appendChild(card);
            });
            container.appendChild(row);
        }

        function showDetail(item) {
            document.getElementById('modal-title').innerText = item.titulo;
            document.getElementById('modal-desc').innerText = item.sinopsis;
            document.getElementById('modal-img').src = API_URL + item.portada;

            const box = document.getElementById('modal-links');
            box.innerHTML = '';
            item.links.forEach(l => {
                const streamUrl = `${API_URL}/api/stream/${l.id}`;
                const div = document.createElement('div');
                div.className = 'btn-play';
                div.innerHTML = `<span>${l.label}</span>
                    <div style="display:flex; gap:10px;">
                        <button onclick="play('${streamUrl}')" style="background:none; border:none; cursor:pointer;">▶ WEB</button>
                        <button class="btn-vlc" onclick="openVLC('${streamUrl}', '${item.titulo}')">VLC</button>
                    </div>`;
                box.appendChild(div);
            });
            document.getElementById('detail-modal').style.display = 'block';
        }

        function openVLC(url, tit) {
            window.location.href = `intent:${url}#Intent;type=video/*;package=org.videolan.vlc;S.title=${encodeURIComponent(tit)};end`;
        }

        function play(url) {
            document.getElementById('player-layer').style.display = 'flex';
            document.getElementById('main-video').src = url;
        }

        function cerrarModal() { document.getElementById('detail-modal').style.display = 'none'; }
        function cerrarPlayer() { document.getElementById('main-video').pause(); document.getElementById('player-layer').style.display = 'none'; }

        init();
    </script>
</body>
</html>
