<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PLAYER TV - Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="css/reproductor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- LIBRERÍAS OFICIALES PARA NAVEGADOR -->
    <!-- Este es el bundle que usa Cineflix y las apps pro (Ya incluye Buffer) -->
    <script src="https://cdn.jsdelivr.net/npm/telegram@2.22.2/browser/telegram.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body style="background: #000; color: #fff; margin: 0; font-family: sans-serif; overflow-x: hidden;">

    <!-- PANTALLA DE CARGA -->
    <div id="loader-screen" style="position:fixed; inset:0; background:#000; z-index:200000; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <h1 style="color:#f5c518; font-size:30px; letter-spacing:5px;">PLAYER TV</h1>
        <div id="boot-status" style="color:#666; margin-top:20px;">Iniciando...</div>
    </div>

    <header style="padding: 20px; text-align: center; border-bottom: 1px solid #222;">
        <h1 style="color: #f5c518; margin: 0; font-size: 24px;">PLAYER TV</h1>
    </header>

    <nav class="nav" style="display: flex; justify-content: center; gap: 15px; padding: 15px;">
        <button class="f-btn active" onclick="cambiarFiltro('inicio', this)">INICIO</button>
        <button class="f-btn" onclick="cambiarFiltro('peliculas', this)">PELÍCULAS</button>
        <button class="f-btn" onclick="cambiarFiltro('series', this)">SERIES</button>
    </nav>

    <div id="content" style="padding: 10px;"></div>

    <!-- MODAL DE LOGIN -->
    <div id="login-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.98); z-index: 100000; align-items:center; justify-content:center;">
        <div style="background:#111; border:2px solid #f5c518; padding:35px; border-radius:20px; width:90%; max-width:400px; text-align:center;">
            <h2 style="color:#f5c518; margin-bottom:20px;">CONECTAR</h2>

            <div id="qr-container" style="background:#fff; width:220px; height:220px; margin:0 auto 20px; padding:10px; border-radius:12px; display:flex; align-items:center; justify-content:center;">
                <div id="qr-code"></div>
                <div id="qr-loading" style="color:#000; font-weight:bold;">Cargando QR...</div>
            </div>

            <p style="font-size:12px; color:#888; margin-bottom:20px;">Escanea con Telegram > Ajustes > Dispositivos</p>

            <input type="text" id="phone-input" placeholder="+34..." style="width:100%; padding:14px; margin-bottom:12px; background:#222; border:1px solid #333; color:white; border-radius:10px;">
            <button onclick="iniciarLogin()" style="width:100%; padding:14px; background:#f5c518; border:none; font-weight:bold; border-radius:10px; cursor:pointer;">ENTRAR</button>
        </div>
    </div>

    <!-- REPRODUCTOR -->
    <div id="player-layer" style="display:none; position:fixed; inset:0; background:#000; z-index: 150000; flex-direction:column; align-items:center; justify-content:center;">
        <button onclick="cerrarReproductor()" style="position:absolute; top:20px; left:20px; background:#f44336; color:white; border:none; padding:12px 25px; border-radius:8px; font-weight:bold;">CERRAR</button>
        <video id="main-video" controls style="width:100%; max-height:80vh;"></video>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="js/main.js"></script>
    <script src="js/telegram-client.js"></script>
</body>
</html>
