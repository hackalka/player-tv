<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PLAYER TV - Premium Netflix Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --netflix-red: #E50914; --bg-black: #141414; --card-w: 160px; --card-h: 240px; }
        body { background: var(--bg-black); color: white; font-family: 'Helvetica Neue', Helvetica, sans-serif; margin: 0; overflow-x: hidden; }

        .header { position: fixed; top: 0; width: 100%; padding: 20px 4%; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); z-index: 1000; display: flex; align-items: center; }
        .logo { color: var(--netflix-red); font-size: 28px; font-weight: 900; letter-spacing: 2px; text-decoration: none; }

        .hero { height: 75vh; position: relative; display: flex; align-items: flex-end; padding: 0 4% 100px; background-size: cover; background-position: center; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(77deg, rgba(0,0,0,0.6) 0, rgba(0,0,0,0) 85%), linear-gradient(0deg, var(--bg-black) 0, transparent 50%); }
        .hero-content { position: relative; z-index: 5; max-width: 600px; }
        .hero-title { font-size: 3.5rem; margin: 0 0 15px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.45); }
        .hero-desc { font-size: 1.2rem; margin-bottom: 20px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .row { margin: 3vw 0; padding-left: 4%; }
        .row-title { font-size: 1.4vw; font-weight: bold; margin-bottom: 0.5em; color: #e5e5e5; }
        .carousel { display: flex; overflow-x: auto; gap: 10px; scrollbar-width: none; padding: 10px 0; }
        .carousel::-webkit-scrollbar { display: none; }

        .card { flex: 0 0 var(--card-w); height: var(--card-h); background: #222; border-radius: 4px; transition: transform 0.3s; cursor: pointer; position: relative; overflow: hidden; }
        .card:hover { transform: scale(1.08); z-index: 10; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-title { position: absolute; bottom: 0; width: 100%; padding: 10px; background: rgba(0,0,0,0.7); font-size: 11px; text-align: center; }

        #player-layer { display: none; position: fixed; inset: 0; background: #000; z-index: 20000; flex-direction: column; align-items: center; justify-content: center; }
        .btn-close { position: absolute; top: 30px; left: 30px; background: rgba(255,255,255,0.2); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; z-index: 100; }

        @media (max-width: 768px) {
            .hero-title { font-size: 2rem; }
            .row-title { font-size: 1.1rem; }
            :root { --card-w: 120px; --card-h: 180px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="#" class="logo">PLAYER TV</a>
    </header>

    <div id="hero" class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 id="hero-title" class="hero-title">Cargando...</h1>
            <p id="hero-desc" class="hero-desc"></p>
            <button onclick="reproducirDestacado()" style="padding: 10px 30px; background: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1.1rem;"><i class="fa fa-play"></i> Reproducir</button>
        </div>
    </div>

    <div id="catalog-container"></div>

    <div id="player-layer">
        <button class="btn-close" onclick="cerrar()">✕ VOLVER</button>
        <video id="main-video" controls autoplay style="width: 100%; max-height: 100vh;"></video>
    </div>

    <script>
        const API_URL = "https://player-tv-a8f4.onrender.com";
        let destacadoId = null;

        async function cargar() {
            try {
                const res = await fetch(`${API_URL}/api/catalogo`);
                const data = await res.json();
                render(data);
            } catch (e) { console.error("Error API:", e); }
        }

        function render(data) {
            const container = document.getElementById('catalog-container');
            container.innerHTML = '';

            const sections = [
                { id: 'peliculas', label: 'PELÍCULAS' },
                { id: 'series', label: 'SERIES' },
                { id: 'deportes', label: 'DEPORTES EN VIVO' }
            ];

            sections.forEach(sec => {
                const items = data[sec.id];
                if (items && items.length > 0) {
                    const row = document.createElement('div');
                    row.className = 'row';
                    row.innerHTML = `<div class="row-title">${sec.label}</div><div class="carousel" id="row-${sec.id}"></div>`;
                    container.appendChild(row);

                    const carousel = document.getElementById(`row-${sec.id}`);
                    items.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        const img = item.portada || `https://via.placeholder.com/160x240/111/f5c518?text=${encodeURIComponent(item.titulo)}`;
                        card.innerHTML = `<img src="${img}"><div class="card-title">${item.titulo}</div>`;
                        card.onclick = () => reproducir(item.id);
                        carousel.appendChild(card);
                    });
                }
            });

            // Hero dinámico con la primera película
            if (data.peliculas.length > 0) {
                const p = data.peliculas[0];
                document.getElementById('hero-title').innerText = p.titulo;
                document.getElementById('hero-desc').innerText = p.sinopsis.substring(0, 200) + "...";
                document.getElementById('hero').style.backgroundImage = `url('${p.portada || ''}')`;
                destacadoId = p.id;
            }
        }

        function reproducir(id) {
            const layer = document.getElementById('player-layer');
            const video = document.getElementById('main-video');
            layer.style.display = 'flex';
            video.src = `${API_URL}/api/stream/${id}`;
        }

        function reproducirDestacado() { if(destacadoId) reproducir(destacadoId); }

        function cerrar() {
            const video = document.getElementById('main-video');
            video.pause();
            document.getElementById('player-layer').style.display = 'none';
        }

        cargar();
    </script>
</body>
</html>
