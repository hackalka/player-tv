<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Tv Player — tu catálogo de cine, series y deportes">
    <meta name="theme-color" content="#0b0b0b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tv Player">
    <title>Tv Player</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo192.png">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23E50914' width='100' height='100' rx='18'/><text x='50' y='70' font-size='52' font-weight='bold' text-anchor='middle' fill='%23fff'>TV</text></svg>">
    <link rel="stylesheet" href="style.css">
    <!-- Firebase (Firestore para favoritos/continuar viendo sincronizados) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="navbar-left">
            <a href="#" class="logo">
                <img class="brand-logo" src="logo192.png" alt="TV+" onerror="this.style.display='none'">
                <span class="logo-text" id="brand-name">TV+</span>
            </a>
            <ul class="nav-links" id="nav-links"></ul>
        </div>
        <div class="navbar-center view-switch" hidden>
            <button id="nav-netflix" class="view-btn active" type="button">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                Cine
            </button>
            <button id="nav-telegram" class="view-btn" type="button">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
                Chat
            </button>
        </div>
        <div class="navbar-right">
            <button class="icon-btn" id="admin-refresh" aria-label="Actualizar catálogo" hidden>
                <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
            <button class="icon-btn" id="admin-lock" aria-label="Administración">
                <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm3 8H9V6a3 3 0 0 1 6 0v3z"/></svg>
            </button>
            <button class="search-btn" aria-label="Buscar">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M21.71 20.29L18 16.61A9 9 0 1 0 16.61 18l3.68 3.68a1 1 0 0 0 1.42 0 1 1 0 0 0 0-1.39zM11 18a7 7 0 1 1 7-7 7 7 0 0 1-7 7z"/></svg>
            </button>
        </div>
    </nav>

    <!-- ===== VISTA CINE (Netflix) ===== -->
    <div id="netflix-view">
        <section class="hero" id="hero">
            <div class="hero-background">
                <img src="" alt="" class="hero-image" id="hero-image">
                <div class="hero-gradient"></div>
            </div>
            <div class="hero-content">
                <span class="hero-badge" id="hero-badge"></span>
                <h1 class="hero-title" id="hero-title"></h1>
                <p class="hero-description" id="hero-description"></p>
                <div class="hero-buttons">
                    <button class="btn btn-play" id="hero-play">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                        Reproducir
                    </button>
                    <button class="btn btn-info" id="hero-info">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                        Más información
                    </button>
                </div>
            </div>
        </section>
        <main class="main-content">
            <div class="rows-container" id="rows-container"></div>
        </main>
    </div>

    <!-- ===== VISTA CHAT (Telegram) ===== -->
    <div id="telegram-view" hidden>
        <div class="tg-layout">
            <aside class="tg-sidebar">
                <div class="tg-sidebar-header">Temas del grupo</div>
                <div class="chat-list" id="chat-list"></div>
            </aside>
            <section class="tg-chat">
                <header class="tg-chat-header">
                    <div class="tg-chat-avatar">#</div>
                    <div>
                        <div class="tg-chat-title" id="chat-header-title">Selecciona un tema</div>
                        <div class="tg-chat-meta" id="chat-header-meta"></div>
                    </div>
                </header>
                <div class="chat-messages" id="chat-messages">
                    <div class="chat-empty">Elige un tema en la lista de la izquierda.</div>
                </div>
            </section>
        </div>
    </div>

    <!-- ===== DETALLE + REPRODUCTOR ===== -->
    <div class="modal" id="player-modal" hidden>
        <div class="modal-overlay"></div>
        <div class="modal-content detail-modal">
            <button class="modal-close" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
            <div class="detail-hero" id="detail-hero">
                <video id="player-video" controls playsinline hidden></video>
                <iframe id="player-iframe" allowfullscreen hidden></iframe>
                <img id="detail-backdrop" class="detail-backdrop" alt="">
                <div class="detail-hero-shade"></div>
                <div class="detail-hero-content">
                    <h2 class="detail-title" id="modal-title"></h2>
                    <div class="detail-actions">
                        <button class="btn btn-play focusable" id="detail-play">
                            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                            Reproducir
                        </button>
                        <button class="btn btn-fav focusable" id="fav-btn" aria-label="Añadir a favoritos">
                            <span class="fav-ico">★</span> <span class="fav-txt">Añadir a favoritos</span>
                        </button>
                        <button class="btn btn-fav focusable" id="watched-btn" aria-label="Marcar como visto">
                            <span class="watched-ico">✓</span> <span class="watched-txt">Marcar como visto</span>
                        </button>
                        <button class="btn btn-fav focusable" id="cover-btn" aria-label="Cambiar carátula" hidden>
                            <span>🖼</span> <span>Cambiar carátula</span>
                        </button>
                    </div>
                </div>
                <div class="player-status" id="player-status" hidden></div>
            </div>
            <div class="modal-details">
                <div class="detail-body">
                    <img class="detail-poster" id="detail-poster" alt="">
                    <div class="detail-info">
                        <div class="modal-meta">
                            <span class="rating" id="modal-rating"></span>
                            <span class="year" id="modal-year"></span>
                            <span class="duration" id="modal-duration"></span>
                            <span class="quality">HD</span>
                        </div>
                        <div class="detail-genres" id="detail-genres"></div>
                        <p class="modal-description" id="modal-description"></p>
                    </div>
                </div>
                <div class="sources" id="sources" hidden>
                    <h3 class="sources-title">Enlaces</h3>
                    <div class="sources-track" id="sources-track"></div>
                </div>
                <div class="player-options" id="player-options" hidden></div>
                <div class="episodes" id="episode-list" hidden>
                    <h3 class="episodes-title">Episodios</h3>
                    <div class="episodes-track" id="episodes-track"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== BÚSQUEDA ===== -->
    <div class="search-overlay" id="search-overlay" hidden>
        <div class="search-container">
            <input type="search" id="search-input" placeholder="Títulos, géneros, deportes..." autocomplete="off">
            <button class="search-close" aria-label="Cerrar búsqueda">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
        <div class="search-filters">
            <select id="filter-genre" class="filter-select"><option value="">Todos los géneros</option></select>
            <select id="filter-year" class="filter-select"><option value="">Todos los años</option></select>
        </div>
        <div class="search-results" id="search-results"></div>
    </div>

    <!-- ===== LOGIN POR USUARIO ===== -->
    <div class="modal" id="login-modal" hidden>
        <div class="modal-overlay"></div>
        <div class="modal-content login-box">
            <h2 class="modal-title">Entra con tu Telegram</h2>
            <p class="login-help">Inicia sesión con tu cuenta para ver el contenido. Tus datos no se comparten.</p>

            <div class="login-step" data-step="phone">
                <label class="login-label" for="login-phone">Número de teléfono (con prefijo de país)</label>
                <input id="login-phone" class="login-input" type="tel" inputmode="tel" placeholder="+34 600 00 00 00" autocomplete="tel">
                <button id="btn-send-code" class="btn btn-play login-action" type="button">Enviar código</button>
            </div>
            <div class="login-step" data-step="code" hidden>
                <label class="login-label" for="login-code">Código recibido en Telegram</label>
                <input id="login-code" class="login-input" type="text" inputmode="numeric" placeholder="1 2 3 4 5" autocomplete="one-time-code">
                <button id="btn-verify-code" class="btn btn-play login-action" type="button">Verificar</button>
                <button id="btn-back-phone" class="btn-link" type="button">‹ Cambiar número</button>
            </div>
            <div class="login-step" data-step="password" hidden>
                <label class="login-label" for="login-password">Contraseña de verificación en dos pasos (2FA)</label>
                <input id="login-password" class="login-input" type="password" placeholder="Tu contraseña 2FA" autocomplete="current-password">
                <button id="btn-verify-password" class="btn btn-play login-action" type="button">Entrar</button>
            </div>
            <p id="login-status" class="boot-status"></p>
        </div>
    </div>

    <!-- ===== LOADING ===== -->
    <div class="loading-screen" id="loading-screen">
        <div class="loading-inner">
            <div class="loader"></div>
            <p id="loading-text">Cargando Tv Player...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
