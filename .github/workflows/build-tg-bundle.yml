name: Build GramJS browser bundle

# Compila el bundle de navegador OFICIAL de GramJS (con Web Crypto, sin el
# crypto de Node) y lo deja en docs/telegram-browser.js para que Cloudflare
# Pages lo sirva como archivo estatico.

on:
  workflow_dispatch:
  push:
    branches: [feature/client-only]
    paths:
      - '.github/workflows/build-tg-bundle.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Clonar el codigo fuente de GramJS
        run: git clone --depth 1 https://github.com/gram-js/gramjs gramjs-src

      - name: Compilar el bundle de navegador
        working-directory: gramjs-src
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps --include=dev
          node generate_webpack.js
          # generate_webpack.js compila de forma asincrona; esperamos al archivo
          for i in $(seq 1 120); do
            if [ -f browser/telegram.js ]; then echo "Bundle listo"; break; fi
            sleep 5
          done
          ls -la browser/telegram.js

      - name: Copiar el bundle a docs/
        run: |
          mkdir -p docs
          cp gramjs-src/browser/telegram.js docs/telegram-browser.js
          echo "Tamano del bundle:"; ls -la docs/telegram-browser.js

      - name: Commit del bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/telegram-browser.js
          git commit -m "build: bundle de navegador de GramJS [skip ci]" || echo "Sin cambios"
          git push
