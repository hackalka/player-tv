name: Build Telegram bundle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-telegram-bundle.yml'
      - 'webpack.config.js'
      - 'tg-entry.js'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de build
        run: >
          npm install --no-save
          telegram@2.26.22
          webpack@5.94.0 webpack-cli@5.1.4
          buffer process stream-browserify crypto-browserify
          path-browserify os-browserify browserify-zlib vm-browserify
          assert util constants-browserify events

      - name: Generar bundle de navegador
        run: npx webpack --config webpack.config.js

      - name: Commit del bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/vendor/telegram.bundle.js
          if git diff --staged --quiet; then
            echo "Sin cambios en el bundle."
          else
            git commit -m "build: bundle de Telegram para navegador [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
