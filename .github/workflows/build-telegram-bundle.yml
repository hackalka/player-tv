name: Build Telegram bundle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-telegram-bundle.yml'
      - 'scripts/build-bundle.js'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de build
        run: npm install --no-save telegram@2.26.22 esbuild@0.20.2 buffer@6.0.3 esbuild-plugin-polyfill-node@0.3.0

      - name: Generar bundle de navegador
        run: node scripts/build-bundle.js

      - name: Commit del bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/vendor/telegram.bundle.js
          if git diff --staged --quiet; then
            echo "Sin cambios en el bundle."
          else
            git commit -m "build: bundle de Telegram para navegador [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
