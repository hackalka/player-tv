<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Sesión - PLAYER TV</title>

    <style>
        body { background: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #111; border: 1px solid #333; padding: 40px; border-radius: 15px; text-align: center; max-width: 420px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.9); }
        h2 { color: #f5c518; letter-spacing: 1px; margin-bottom: 5px; }
        p { color: #888; font-size: 13px; margin-bottom: 30px; min-height: 40px; line-height: 1.5; }
        input { width: 100%; padding: 16px; margin: 10px 0; background: #222; border: 1px solid #333; color: #fff; border-radius: 10px; font-size: 16px; box-sizing: border-box; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #f5c518; }
        button { width: 100%; padding: 16px; background: #f5c518; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 16px; color: #000; }
        button:disabled { background: #333; color: #666; cursor: wait; }
        #session-res { background: #000; color: #22c55e; padding: 20px; border: 1px dashed #22c55e; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 11px; word-break: break-all; max-height: 200px; overflow-y: auto; text-align: left; display: none; margin-top: 25px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="card">
        <h2>TELEGRAM LOGIN</h2>
        <p id="info">Estableciendo entorno seguro...</p>

        <div id="login-form">
            <input type="tel" id="phone" placeholder="+34 600 000 000" autocomplete="tel">
            <input type="text" id="code" placeholder="Código de 5 dígitos" style="display:none;" autocomplete="one-time-code">
            <input type="password" id="2fa" placeholder="Contraseña Cloud" style="display:none;" autocomplete="current-password">
            <button id="btn-main" onclick="handleLogin()" disabled>CARGANDO...</button>
        </div>

        <div id="session-res"></div>
    </div>

    <!-- CARGA LOCAL PARA EVITAR BLOQUEOS DE RASTREO -->
    <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/telegram@2.22.2/browser/telegram.js"></script>

    <script>
        const apiId = 8952741;
        const apiHash = "693fb2da124662dad85b2b337c53a386";
        let client = null;
        let step = 'phone';
        let resolver = null;

        async function init() {
            const info = document.getElementById('info');
            const btn = document.getElementById('btn-main');

            // Polyfill para Buffer (Asegurando compatibilidad total)
            if (typeof window.Buffer === 'undefined' && window.buffer) {
                window.Buffer = window.buffer.Buffer;
            }
            window.process = { env: {} };

            // Detectar motor de Telegram
            const lib = window.telegram || window.gramjs;

            if (!lib || !window.Buffer) {
                info.innerHTML = "⏳ Esperando librerías... <br><span style='font-size:11px; color:#555;'>Si no avanza, refresca la página (F5)</span>";
                setTimeout(init, 500);
                return;
            }

            try {
                const { TelegramClient } = lib;
                const { StringSession } = lib.sessions;

                // Cliente configurado para máxima compatibilidad web
                client = new TelegramClient(new StringSession(""), apiId, apiHash, {
                    connectionRetries: 5,
                    useWSS: true
                });

                info.innerText = "✅ Motor listo. Escribe tu teléfono con el prefijo (ej: +34).";
                btn.disabled = false;
                btn.innerText = "ENVIAR TELÉFONO";
            } catch (e) {
                info.innerText = "❌ Fallo al iniciar: " + e.message;
            }
        }

        async function handleLogin() {
            const btn = document.getElementById('btn-main');
            const info = document.getElementById('info');

            if (step === 'phone') {
                const phone = document.getElementById('phone').value.trim();
                if (!phone) return alert("Pon tu número de teléfono");

                btn.disabled = true;
                btn.innerText = "SOLICITANDO CÓDIGO...";

                try {
                    await client.start({
                        phoneNumber: async () => phone,
                        phoneCode: async () => {
                            step = 'code';
                            document.getElementById('phone').style.display = 'none';
                            document.getElementById('code').style.display = 'block';
                            btn.disabled = false;
                            btn.innerText = "VERIFICAR CÓDIGO";
                            info.innerText = "Escribe el código que has recibido por Telegram.";
                            return new Promise(r => resolver = r);
                        },
                        password: async () => {
                            document.getElementById('code').style.display = 'none';
                            document.getElementById('2fa').style.display = 'block';
                            btn.disabled = false;
                            btn.innerText = "VERIFICAR 2FA";
                            info.innerText = "Tu cuenta tiene contraseña. Introdúcela abajo.";
                            return new Promise(r => resolver = r);
                        },
                        onError: (err) => {
                            alert("Error: " + err.message);
                            location.reload();
                        }
                    });

                    // ÉXITO: Generar el código final
                    document.getElementById('login-form').style.display = 'none';
                    const resBox = document.getElementById('session-res');
                    resBox.innerText = client.session.save();
                    resBox.style.display = 'block';
                    info.innerHTML = "<b style='color:#f5c518'>🎉 ¡CONSEGUIDO!</b><br>Copia este código y pégalo en Render (SESSION).";
                    document.querySelector('h2').innerText = "SESIÓN LISTA";

                } catch (e) {
                    alert("Fallo crítico: " + e.message);
                    location.reload();
                }
            } else {
                const val = (step === 'code') ? document.getElementById('code').value.trim() : document.getElementById('2fa').value.trim();
                if (resolver) resolver(val);
            }
        }

        init();
    </script>
</body>
</html>
