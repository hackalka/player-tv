<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TELEGRAM SESSION GENERATOR - PLAYER TV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 1. Cimientos de seguridad (Buffer) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/buffer/6.0.3/buffer.min.js"></script>
    <script>
        // Polyfill robusto para navegadores
        window.Buffer = window.Buffer || (window.buffer && window.buffer.Buffer) ? window.buffer.Buffer : undefined;
        window.process = { env: { DEBUG: undefined } };
        window.global = window;
        window.require = function(m) {
            if (m === "buffer") return { Buffer: window.Buffer };
            return {};
        };
    </script>

    <!-- 2. Motor Telegram (Versión oficial para navegador) -->
    <script src="https://cdn.jsdelivr.net/npm/telegram/browser/telegram.js"></script>

    <style>
        body { background: #06090e; color: #fff; font-family: 'Helvetica Neue', Helvetica, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #10141d; border: 1px solid #232c3d; padding: 40px; border-radius: 16px; text-align: center; max-width: 450px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        h2 { color: #f5c518; margin-bottom: 10px; font-weight: 800; letter-spacing: 1px; }
        p { color: #8b8e96; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; color: #ccc; font-size: 14px; }
        input { width: 100%; padding: 16px; margin-bottom: 10px; background: #1a1a2e; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #f5c518; }
        button { width: 100%; padding: 16px; background: #f5c518; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 16px; transition: transform 0.2s, background 0.3s; }
        button:hover { background: #e2b616; transform: translateY(-2px); }
        button:disabled { background: #444; color: #777; cursor: wait; transform: none; }
        #output-area { display: none; margin-top: 25px; text-align: left; }
        #session-box { background: #000; color: #22c55e; padding: 20px; border: 1px dashed #22c55e; border-radius: 8px; font-family: 'Consolas', monospace; font-size: 11px; word-break: break-all; max-height: 180px; overflow-y: auto; line-height: 1.5; }
        .success-label { font-size: 11px; color: #4ade80; margin-bottom: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>TELEGRAM SETUP</h2>
        <p id="status-msg">Iniciando motor de conexión segura...</p>

        <div id="login-fields">
            <div class="form-group" id="phone-group">
                <label>Número de Teléfono</label>
                <input type="tel" id="phone" placeholder="+34 600 000 000" autocomplete="tel">
            </div>

            <div class="form-group" id="code-group" style="display:none;">
                <label>Código de Telegram</label>
                <input type="text" id="code" placeholder="12345" autocomplete="one-time-code">
            </div>

            <div class="form-group" id="2fa-group" style="display:none;">
                <label>Contraseña Cloud (2FA)</label>
                <input type="password" id="2fa" placeholder="Tu contraseña..." autocomplete="current-password">
            </div>

            <button id="btn-action" onclick="processLogin()" disabled>ESPERE...</button>
        </div>

        <div id="output-area">
            <span class="success-label">✅ SESIÓN GENERADA (CÓPIALA ENTERA):</span>
            <div id="session-box"></div>
            <p style="margin-top:20px; color:#f5c518; font-size:12px;">Pega este código en el panel de Render, en la variable <b>SESSION</b>.</p>
            <button onclick="location.reload()" style="background:#333; color:white;">GENERAR OTRA</button>
        </div>
    </div>

    <script>
        const API_ID = 8952741;
        const API_HASH = "693fb2da124662dad85b2b337c53a386";
        let client = null;
        let loginStep = 'phone';
        let loginPromise = null;

        async function init() {
            try {
                // Forzar Buffer si el navegador lo bloqueó
                if (typeof window.Buffer === 'undefined' && typeof window.buffer !== 'undefined') {
                    window.Buffer = window.buffer.Buffer;
                }

                if (!window.telegram || !window.Buffer) {
                    setTimeout(init, 500);
                    return;
                }

                const { TelegramClient } = window.telegram;
                const { StringSession } = window.telegram.sessions;
                client = new TelegramClient(new StringSession(""), API_ID, API_HASH, { connectionRetries: 5 });

                document.getElementById('status-msg').innerText = "Motor listo. Introduce tu teléfono para recibir el código de Telegram.";
                const btn = document.getElementById('btn-action');
                btn.innerText = "ENVIAR TELÉFONO";
                btn.disabled = false;
            } catch (e) {
                document.getElementById('status-msg').innerText = "Error cargando motor: " + e.message;
            }
        }

        async function processLogin() {
            const btn = document.getElementById('btn-action');
            const status = document.getElementById('status-msg');

            if (loginStep === 'phone') {
                const phone = document.getElementById('phone').value.trim();
                if (!phone) return alert("Escribe tu teléfono con el prefijo (+34...)");

                btn.disabled = true;
                btn.innerText = "CONECTANDO...";

                try {
                    await client.start({
                        phoneNumber: async () => phone,
                        phoneCode: async () => {
                            loginStep = 'code';
                            document.getElementById('phone-group').style.display = 'none';
                            document.getElementById('code-group').style.display = 'block';
                            btn.disabled = false;
                            btn.innerText = "VERIFICAR CÓDIGO";
                            status.innerText = "Introduce el código que te envió Telegram.";
                            return new Promise(r => loginPromise = r);
                        },
                        password: async () => {
                            document.getElementById('code-group').style.display = 'none';
                            document.getElementById('2fa-group').style.display = 'block';
                            btn.disabled = false;
                            btn.innerText = "ENTRAR";
                            status.innerText = "Tu cuenta tiene Verificación en 2 pasos. Pon tu contraseña.";
                            return new Promise(r => loginPromise = r);
                        },
                        onError: (err) => {
                            alert("Telegram Error: " + err.message);
                            location.reload();
                        }
                    });

                    // ÉXITO
                    document.getElementById('login-fields').style.display = 'none';
                    document.getElementById('output-area').style.display = 'block';
                    document.getElementById('session-box').innerText = client.session.save();
                    status.innerText = "✅ Sesión generada correctamente.";
                    document.querySelector('h2').innerText = "¡TODO LISTO!";

                } catch (e) {
                    alert("Error: " + e.message);
                    location.reload();
                }
            } else {
                const val = (loginStep === 'code') ? document.getElementById('code').value.trim() : document.getElementById('2fa').value.trim();
                if (loginPromise) loginPromise(val);
            }
        }

        init();
    </script>
</body>
</html>
