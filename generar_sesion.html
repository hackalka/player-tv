<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TELEGRAM SESSION - PLAYER TV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 1. SHIM AMBIENTE (Blindaje Total) -->
    <script>
        // Define require y otros para evitar errores en navegador
        window.global = window;
        window.process = { env: { DEBUG: undefined } };
        window.exports = {};
        window.module = { exports: {} };
        window.require = function(m) {
            if (m === "buffer") return { Buffer: window.Buffer };
            return window[m] || {};
        };
    </script>

    <!-- 2. LIBRERÍAS (Carga en orden estricto) -->
    <!-- Buffer (Cimiento) -->
    <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
    <script>
        // Forzar Buffer global de inmediato
        if (typeof window.Buffer === 'undefined') {
            window.Buffer = (window.buffer && window.buffer.Buffer) ? window.buffer.Buffer : undefined;
        }
    </script>

    <!-- Telegram (Motor) -->
    <script src="https://cdn.jsdelivr.net/npm/telegram/browser/telegram.js"></script>

    <style>
        body { background: #06090e; color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #10141d; border: 1px solid #232c3d; padding: 40px; border-radius: 16px; text-align: center; max-width: 420px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        h2 { color: #f5c518; margin-top: 0; font-weight: 900; letter-spacing: 1px; }
        p { color: #8b8e96; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        input { width: 100%; padding: 16px; margin: 8px 0; background: #1a1a2e; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #f5c518; }
        button { width: 100%; padding: 16px; background: #f5c518; color: #000; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 15px; font-size: 16px; transition: transform 0.2s, background 0.3s; }
        button:hover { background: #e2b616; transform: translateY(-2px); }
        button:disabled { background: #444; color: #777; cursor: wait; transform: none; }
        #output-area { display: none; margin-top: 25px; text-align: left; }
        #session-box { background: #000; color: #22c55e; padding: 20px; border: 1px dashed #22c55e; border-radius: 8px; font-family: 'Consolas', monospace; font-size: 11px; word-break: break-all; max-height: 180px; overflow-y: auto; line-height: 1.5; }
        .hint { font-size: 11px; color: #4ade80; margin-bottom: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>TELEGRAM SETUP</h2>
        <p id="msg">Estableciendo entorno seguro...</p>

        <div id="form">
            <input type="tel" id="phone" placeholder="+34 600 000 000" autocomplete="tel">
            <input type="text" id="code" placeholder="Código de 5 dígitos" style="display:none;" autocomplete="one-time-code">
            <input type="password" id="2fa" placeholder="Contraseña de 2 pasos" style="display:none;" autocomplete="current-password">
            <button id="btn" onclick="handle()" disabled>ESPERE...</button>
        </div>

        <div id="output-area">
            <div class="hint">✅ SESIÓN GENERADA:</div>
            <div id="session-box"></div>
            <p style="margin-top:20px; color:#f5c518; font-size:12px;">Copia este código y pégalo en el panel de Render (Variable SESSION).</p>
        </div>
    </div>

    <script>
        const API_ID = 8952741;
        const API_HASH = "693fb2da124662dad85b2b337c53a386";
        let client = null;
        let step = 'phone';
        let promiseResolver = null;

        async function init() {
            const msg = document.getElementById('msg');
            const btn = document.getElementById('btn');

            // Esperar a que las librerías se carguen en el navegador
            if (!window.telegram || !window.Buffer) {
                console.log("⏳ Reintentando carga de librerías...");
                setTimeout(init, 500);
                return;
            }

            try {
                const { TelegramClient } = window.telegram;
                const { StringSession } = window.telegram.sessions;
                client = new TelegramClient(new StringSession(""), API_ID, API_HASH, { connectionRetries: 5 });

                msg.innerText = "Listo. Introduce tu teléfono con el prefijo (+34...).";
                btn.disabled = false;
                btn.innerText = "ENVIAR TELÉFONO";
            } catch (e) {
                msg.innerText = "❌ Fallo: " + e.message;
            }
        }

        async function handle() {
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');

            if (step === 'phone') {
                const phone = document.getElementById('phone').value.trim();
                if (!phone) return alert("Pon tu número");

                btn.disabled = true;
                btn.innerText = "CONECTANDO...";

                try {
                    await client.start({
                        phoneNumber: async () => phone,
                        phoneCode: async () => {
                            step = 'code';
                            document.getElementById('phone').style.display = 'none';
                            document.getElementById('code').style.display = 'block';
                            btn.disabled = false;
                            btn.innerText = "VERIFICAR CÓDIGO";
                            msg.innerText = "Introduce el código que te mandó Telegram.";
                            return new Promise(r => promiseResolver = r);
                        },
                        password: async () => {
                            document.getElementById('code').style.display = 'none';
                            document.getElementById('2fa').style.display = 'block';
                            btn.disabled = false;
                            btn.innerText = "VERIFICAR 2FA";
                            msg.innerText = "Introduce tu contraseña de 2 pasos.";
                            return new Promise(r => promiseResolver = r);
                        },
                        onError: (err) => {
                            alert("Telegram Error: " + err.message);
                            location.reload();
                        }
                    });

                    // FINALIZADO
                    document.getElementById('form').style.display = 'none';
                    document.getElementById('output-area').style.display = 'block';
                    document.getElementById('session-box').innerText = client.session.save();
                    msg.innerText = "¡Todo ha ido perfecto!";
                    document.querySelector('h2').innerText = "¡SESIÓN LISTA!";

                } catch (e) {
                    alert("Fallo crítico: " + e.message);
                    location.reload();
                }
            } else {
                const val = (step === 'code') ? document.getElementById('code').value : document.getElementById('2fa').value;
                if (promiseResolver) promiseResolver(val);
            }
        }

        init();
    </script>
</body>
</html>
