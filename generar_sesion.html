<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GENERADOR DE SESIÓN - PLAYER TV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SHIM DE AMBIENTE -->
    <script>
        window.global = window;
        window.process = { env: {} };
        window.exports = {};
        window.module = { exports: {} };
        window.require = function(m) {
            if (m === "buffer") return { Buffer: window.Buffer };
            return {};
        };
    </script>

    <!-- LIBRERÍAS (Carga prioritaria) -->
    <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/telegram@2.22.2/browser/telegram.js"></script>

    <style>
        body { background: #06090e; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #10141d; border: 1px solid #232c3d; padding: 40px; border-radius: 20px; text-align: center; max-width: 420px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
        h2 { color: #f5c518; margin-top: 0; font-weight: 900; }
        #msg { color: #8b8e96; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        input { width: 100%; padding: 16px; margin: 8px 0; background: #1a1a2e; border: 1px solid #333; color: #fff; border-radius: 10px; font-size: 16px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 16px; background: #f5c518; color: #000; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 15px; font-size: 16px; }
        button:disabled { background: #444; color: #777; cursor: wait; }
        #session-box { display: none; background: #000; color: #22c55e; padding: 20px; border: 1px dashed #22c55e; border-radius: 8px; font-family: monospace; font-size: 11px; word-break: break-all; max-height: 180px; overflow-y: auto; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>

    <div class="card">
        <h2>TELEGRAM LOGIN</h2>
        <p id="msg">Iniciando motor...</p>

        <div id="form">
            <input type="tel" id="phone" placeholder="+34 600 000 000">
            <input type="text" id="code" placeholder="Código" style="display:none;">
            <input type="password" id="2fa" placeholder="Contraseña 2FA" style="display:none;">
            <button id="btn" onclick="handle()" disabled>ESPERE...</button>
        </div>

        <div id="session-box"></div>
    </div>

    <script>
        const API_ID = 8952741;
        const API_HASH = "693fb2da124662dad85b2b337c53a386";
        let client = null;
        let step = 'phone';
        let resolver = null;

        async function init() {
            const msg = document.getElementById('msg');
            const btn = document.getElementById('btn');

            // FUERZA BRUTA: Inyectar Buffer si el navegador lo bloqueó
            if (typeof window.Buffer === 'undefined' && window.buffer) {
                window.Buffer = window.buffer.Buffer;
            }

            // DETECCCIÓN MAESTRA: Telegram puede llamarse de varias formas
            const tgLib = window.telegram || window.gramjs || window.Telegram;

            if (!tgLib || !window.Buffer) {
                console.log("⏳ Buscando librerías en memoria...");
                msg.innerText = "Sincronizando seguridad (Buffer)...";
                setTimeout(init, 500);
                return;
            }

            try {
                const { TelegramClient } = tgLib;
                const { StringSession } = tgLib.sessions;
                client = new TelegramClient(new StringSession(""), API_ID, API_HASH, { connectionRetries: 5 });

                msg.innerText = "✅ Motor listo. Escribe tu teléfono con +34.";
                btn.disabled = false;
                btn.innerText = "ENVIAR TELÉFONO";
            } catch (e) {
                msg.innerText = "❌ Error: " + e.message;
            }
        }

        async function handle() {
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');

            if (step === 'phone') {
                const phone = document.getElementById('phone').value.trim();
                if (!phone) return alert("Escribe tu número");
                btn.disabled = true;
                btn.innerText = "CONECTANDO...";

                try {
                    await client.start({
                        phoneNumber: async () => phone,
                        phoneCode: async () => {
                            step = 'code';
                            document.getElementById('phone').style.display = 'none';
                            document.getElementById('code').style.display = 'block';
                            btn.disabled = false;
                            btn.innerText = "VERIFICAR CÓDIGO";
                            msg.innerText = "Introduce el código que has recibido.";
                            return new Promise(r => resolver = r);
                        },
                        password: async () => {
                            document.getElementById('code').style.display = 'none';
                            document.getElementById('2fa').style.display = 'block';
                            btn.disabled = false;
                            btn.innerText = "VERIFICAR 2FA";
                            msg.innerText = "Tu cuenta tiene contraseña 2FA.";
                            return new Promise(r => resolver = r);
                        },
                        onError: (err) => alert("Error: " + err.message)
                    });

                    document.getElementById('form').style.display = 'none';
                    const box = document.getElementById('session-box');
                    box.innerText = client.session.save();
                    box.style.display = 'block';
                    msg.innerHTML = "<b style='color:#f5c518'>✅ SESIÓN GENERADA!</b><br>Copia el código verde y ponlo en Render.";
                } catch (e) {
                    alert("Fallo: " + e.message);
                    location.reload();
                }
            } else {
                const val = (step === 'code') ? document.getElementById('code').value : document.getElementById('2fa').value;
                if (resolver) resolver(val);
            }
        }

        init();
    </script>
</body>
</html>
