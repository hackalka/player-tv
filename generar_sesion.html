<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TELEGRAM SESSION - PLAYER TV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 1. Cimientos de seguridad (Buffer) -->
    <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
    <script>
        // Polyfill robusto para evitar errores de require y buffer
        window.Buffer = window.Buffer || (window.buffer && window.buffer.Buffer) ? window.buffer.Buffer : undefined;
        window.process = { env: {} };
        window.global = window;
        window.require = function(m) {
            if (m === "buffer") return { Buffer: window.Buffer };
            return {};
        };
    </script>

    <!-- 2. Motor Telegram (Versión oficial) -->
    <script src="https://cdn.jsdelivr.net/npm/telegram/browser/telegram.js"></script>

    <style>
        body { background: #06090e; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #10141d; border: 1px solid #232c3d; padding: 40px; border-radius: 16px; text-align: center; max-width: 450px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        h2 { color: #f5c518; margin-top: 0; font-weight: 900; letter-spacing: 1px; }
        p { color: #8b8e96; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        input { width: 100%; padding: 16px; margin-bottom: 10px; background: #1a1a2e; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #f5c518; }
        button { width: 100%; padding: 16px; background: #f5c518; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 16px; }
        button:disabled { background: #444; color: #777; cursor: wait; }
        #session-box { background: #000; color: #22c55e; padding: 20px; border: 1px dashed #22c55e; border-radius: 8px; font-family: monospace; font-size: 11px; word-break: break-all; max-height: 180px; overflow-y: auto; display: none; margin-top: 25px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>TELEGRAM SETUP</h2>
        <p id="msg">Iniciando motor seguro...</p>

        <div id="form">
            <input type="tel" id="phone" placeholder="+34 600 000 000">
            <input type="text" id="code" placeholder="Código" style="display:none;">
            <input type="password" id="2fa" placeholder="Contraseña 2FA" style="display:none;">
            <button id="btn" onclick="handle()" disabled>ESPERE...</button>
        </div>

        <div id="session-box"></div>
    </div>

    <script>
        const API_ID = 8952741;
        const API_HASH = "693fb2da124662dad85b2b337c53a386";
        let client = null;
        let step = 'phone';
        let resolver = null;

        async function init() {
            // Esperar a que las librerías se carguen
            if (!window.telegram || !window.Buffer) {
                console.log("⏳ Reintentando carga...");
                setTimeout(init, 500);
                return;
            }

            const { TelegramClient } = window.telegram;
            const { StringSession } = window.telegram.sessions;
            client = new TelegramClient(new StringSession(""), API_ID, API_HASH, { connectionRetries: 5 });

            document.getElementById('msg').innerText = "Motor listo. Escribe tu teléfono (+34...).";
            const btn = document.getElementById('btn');
            btn.disabled = false;
            btn.innerText = "ENVIAR TELÉFONO";
        }

        async function handle() {
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');

            if (step === 'phone') {
                const phone = document.getElementById('phone').value.trim();
                btn.disabled = true;
                btn.innerText = "CONECTANDO...";

                try {
                    await client.start({
                        phoneNumber: async () => phone,
                        phoneCode: async () => {
                            step = 'code';
                            document.getElementById('phone').style.display = 'none';
                            document.getElementById('code').style.display = 'block';
                            btn.disabled = false;
                            btn.innerText = "VERIFICAR CÓDIGO";
                            msg.innerText = "Introduce el código recibido.";
                            return new Promise(r => resolver = r);
                        },
                        password: async () => {
                            document.getElementById('code').style.display = 'none';
                            document.getElementById('2fa').style.display = 'block';
                            btn.disabled = false;
                            btn.innerText = "ENTRAR";
                            msg.innerText = "Introduce tu contraseña de 2 pasos.";
                            return new Promise(r => resolver = r);
                        },
                        onError: (err) => alert("Error: " + err.message)
                    });

                    document.getElementById('form').style.display = 'none';
                    const box = document.getElementById('session-box');
                    box.innerText = client.session.save();
                    box.style.display = 'block';
                    msg.innerHTML = "<b>✅ SESIÓN GENERADA!</b><br>Copia el código de abajo y ponlo en Render.";
                } catch (e) {
                    alert("Fallo crítico: " + e.message);
                    location.reload();
                }
            } else {
                const val = (step === 'code') ? document.getElementById('code').value : document.getElementById('2fa').value;
                if (resolver) resolver(val);
            }
        }
        init();
    </script>
</body>
</html>
