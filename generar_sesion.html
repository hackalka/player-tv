<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TELEGRAM ENGINE - PLAYER TV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FIX PARA EVITAR BLOQUEOS Y ERRORES DE REQUIRE -->
    <script>
        window.Buffer = null;
        window.process = { env: {} };
        window.require = function(m) {
            if (m === "buffer") return { Buffer: window.Buffer };
            return {};
        };
    </script>

    <!-- Cargamos Buffer de forma segura -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/buffer/6.0.3/buffer.min.js"></script>
    <script>
        if (typeof window.buffer !== 'undefined') window.Buffer = window.buffer.Buffer;
    </script>

    <!-- Cargamos Telegram (Versión estable) -->
    <script src="https://cdn.jsdelivr.net/npm/telegram@2.19.12/browser/telegram.js"></script>

    <style>
        body { background: #06090e; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #10141d; border: 2px solid #ff5500; padding: 40px; border-radius: 12px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        h1 { color: #ff5500; font-size: 24px; margin-bottom: 5px; }
        p { color: #888; font-size: 13px; margin-bottom: 25px; }
        input { width: 100%; padding: 14px; margin: 8px 0; background: #1a1a2e; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 14px; background: #ff5500; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 16px; }
        button:disabled { background: #444; cursor: wait; }
        #output { background: #000; color: #22c55e; padding: 15px; font-family: monospace; font-size: 11px; word-break: break-all; margin-top: 20px; border: 1px dashed #22c55e; display: none; text-align: left; }
    </style>
</head>
<body>

    <div class="card">
        <h1>PLAYER TV</h1>
        <p id="msg">Iniciando protocolos de seguridad...</p>

        <div id="login-form">
            <input type="tel" id="phone" placeholder="+34 600 000 000">
            <input type="text" id="code" placeholder="Código" style="display:none;">
            <input type="password" id="2fa" placeholder="Contraseña 2FA" style="display:none;">
            <button id="btn" onclick="handle()" disabled>ESPERE...</button>
        </div>

        <div id="output"></div>
    </div>

    <script>
        const apiId = 8952741;
        const apiHash = "693fb2da124662dad85b2b337c53a386";
        let client = null;
        let step = 'phone';
        let resolver = null;

        async function init() {
            const msg = document.getElementById('msg');
            const btn = document.getElementById('btn');

            if (!window.telegram || !window.Buffer) {
                setTimeout(init, 500);
                return;
            }

            const { TelegramClient } = window.telegram;
            const { StringSession } = window.telegram.sessions;
            client = new TelegramClient(new StringSession(""), apiId, apiHash, { connectionRetries: 5 });

            msg.innerText = "Listo. Introduce tu teléfono (+34...).";
            btn.disabled = false;
            btn.innerText = "ENVIAR TELÉFONO";
        }

        async function handle() {
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');

            if (step === 'phone') {
                const phone = document.getElementById('phone').value.trim();
                btn.disabled = true;
                btn.innerText = "CONECTANDO...";

                try {
                    await client.start({
                        phoneNumber: async () => phone,
                        phoneCode: async () => {
                            step = 'code';
                            document.getElementById('phone').style.display = 'none';
                            document.getElementById('code').style.display = 'block';
                            btn.disabled = false;
                            btn.innerText = "VERIFICAR CÓDIGO";
                            msg.innerText = "Escribe el código que te mandó Telegram.";
                            return new Promise(r => resolver = r);
                        },
                        password: async () => {
                            document.getElementById('code').style.display = 'none';
                            document.getElementById('2fa').style.display = 'block';
                            btn.disabled = false;
                            btn.innerText = "ENTRAR";
                            msg.innerText = "Tu cuenta tiene contraseña. Ponla abajo.";
                            return new Promise(r => resolver = r);
                        },
                        onError: (err) => alert(err.message)
                    });

                    document.getElementById('login-form').style.display = 'none';
                    const out = document.getElementById('output');
                    out.innerText = client.session.save();
                    out.style.display = 'block';
                    msg.innerHTML = "<b style='color:#ff5500'>✅ SESIÓN LISTA.</b><br>Copia el código verde y pégalo en Render.";
                } catch (e) {
                    alert("Error: " + e.message);
                    location.reload();
                }
            } else {
                const val = (step === 'code') ? document.getElementById('code').value : document.getElementById('2fa').value;
                if (resolver) resolver(val);
            }
        }
        init();
    </script>
</body>
</html>
