<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Sesión - PLAYER TV</title>

    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #111; border: 1px solid #333; padding: 40px; border-radius: 15px; text-align: center; max-width: 420px; width: 90%; box-shadow: 0 15px 50px rgba(0,0,0,0.8); }
        h2 { color: #f5c518; letter-spacing: 2px; margin-bottom: 5px; }
        p { color: #888; font-size: 13px; margin-bottom: 30px; min-height: 40px; }
        input { width: 100%; padding: 16px; margin: 10px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 10px; font-size: 16px; box-sizing: border-box; outline: none; border: 1px solid transparent; }
        input:focus { border-color: #f5c518; }
        button { width: 100%; padding: 16px; background: #f5c518; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 16px; color: #000; }
        button:disabled { background: #333; color: #555; cursor: wait; }
        #session-res { background: #000; color: #22c55e; padding: 15px; border: 1px dashed #22c55e; border-radius: 8px; font-family: monospace; font-size: 11px; word-break: break-all; max-height: 150px; overflow-y: auto; text-align: left; display: none; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>TELEGRAM SETUP</h2>
        <p id="info">Cargando cimientos del sistema...</p>

        <div id="login-form">
            <input type="tel" id="phone" placeholder="+34 600 000 000">
            <input type="text" id="code" placeholder="Código de 5 dígitos" style="display:none;">
            <input type="password" id="2fa" placeholder="Contraseña Cloud" style="display:none;">
            <button id="btn-main" onclick="handleLogin()" disabled>CONECTANDO...</button>
        </div>

        <div id="session-res"></div>
    </div>

    <!-- 1. BUFFER (Fallback total) -->
    <script src="https://bundle.run/buffer@6.0.3"></script>

    <!-- 2. GRAMJS BROWSER -->
    <script src="https://cdn.jsdelivr.net/npm/telegram/browser/telegram.js"></script>

    <script>
        const apiId = 8952741;
        const apiHash = "693fb2da124662dad85b2b337c53a386";
        let client = null;
        let step = 'phone';
        let resolver = null;

        async function init() {
            const info = document.getElementById('info');
            const btn = document.getElementById('btn-main');

            // Polyfill para Buffer
            if (typeof window.Buffer === 'undefined') {
                if (typeof window.buffer !== 'undefined') window.Buffer = window.buffer.Buffer;
                else if (typeof require !== 'undefined') {
                    try { window.Buffer = require('buffer').Buffer; } catch(e){}
                }
            }

            window.process = { env: {} };

            const lib = window.telegram || window.gramjs;

            if (!lib || !window.Buffer) {
                info.innerText = "⏳ Esperando librerías... (Si tarda más de 5 seg, usa otro navegador)";
                setTimeout(init, 500);
                return;
            }

            try {
                const { TelegramClient } = lib;
                const { StringSession } = lib.sessions;
                client = new TelegramClient(new StringSession(""), apiId, apiHash, { connectionRetries: 5 });

                info.innerText = "✅ Motor listo. Escribe tu teléfono con +34...";
                btn.disabled = false;
                btn.innerText = "ENVIAR TELÉFONO";
            } catch (e) {
                info.innerText = "❌ Error en el motor: " + e.message;
            }
        }

        async function handleLogin() {
            const btn = document.getElementById('btn-main');
            const info = document.getElementById('info');

            if (step === 'phone') {
                const phone = document.getElementById('phone').value.trim();
                if (!phone) return alert("Pon tu número");

                btn.disabled = true;
                btn.innerText = "CONECTANDO A TELEGRAM...";

                try {
                    await client.start({
                        phoneNumber: async () => phone,
                        phoneCode: async () => {
                            step = 'code';
                            document.getElementById('phone').style.display = 'none';
                            document.getElementById('code').style.display = 'block';
                            btn.disabled = false;
                            btn.innerText = "VERIFICAR CÓDIGO";
                            info.innerText = "Telegram te ha enviado un código. Ponlo abajo.";
                            return new Promise(r => resolver = r);
                        },
                        password: async () => {
                            document.getElementById('code').style.display = 'none';
                            document.getElementById('2fa').style.display = 'block';
                            btn.disabled = false;
                            btn.innerText = "VERIFICAR 2FA";
                            info.innerText = "Tu cuenta tiene Verificación en 2 pasos.";
                            return new Promise(r => resolver = r);
                        },
                        onError: (err) => {
                            alert("Error de Telegram: " + err.message);
                            location.reload();
                        }
                    });

                    // ÉXITO
                    document.getElementById('login-form').style.display = 'none';
                    const resBox = document.getElementById('session-res');
                    resBox.innerText = client.session.save();
                    resBox.style.display = 'block';
                    info.innerHTML = "<b style='color:#f5c518'>✅ SESIÓN GENERADA.</b><br>Copia el código verde y pégalo en Render.";
                    document.querySelector('h2').innerText = "¡TODO LISTO!";

                } catch (e) {
                    alert("Error crítico: " + e.message);
                    location.reload();
                }
            } else {
                const val = (step === 'code') ? document.getElementById('code').value.trim() : document.getElementById('2fa').value.trim();
                if (resolver) resolver(val);
            }
        }

        init();
    </script>
</body>
</html>
