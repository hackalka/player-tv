<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sincronizador Pro TMDB + Trailers</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --gold: #f5c518; --bg: #06090e; --surface: #10141d; --border: #232c3d; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: var(--surface); padding: 30px; border-radius: 15px; border: 1px solid var(--border); }
        
        button { background: var(--gold); border: none; padding: 15px 40px; font-weight: bold; cursor: pointer; border-radius: 8px; font-size: 16px; transition: 0.3s; }
        button:hover { transform: scale(1.05); background: #ffcc00; }
        button:disabled { background: #444; cursor: not-allowed; }

        /* Selector de películas */
        #selector-container { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            z-index: 1000; padding: 40px; overflow-y: auto; 
        }
        .grid-seleccion { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; max-width: 1000px; margin: auto; 
        }
        .opcion-card { 
            background: #1a202c; border: 2px solid #333; border-radius: 10px; 
            padding: 10px; cursor: pointer; transition: 0.2s; 
        }
        .opcion-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .opcion-card img { width: 100%; border-radius: 5px; margin-bottom: 10px; }
        .opcion-card h4 { font-size: 14px; margin: 5px 0; height: 40px; overflow: hidden; }

        #log { margin-top: 25px; text-align: left; background: #000; color: #00ff00; font-family: monospace; font-size: 13px; height: 300px; overflow-y: auto; border: 1px solid #333; padding: 15px; border-radius: 5px; }
        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .stat-box { background: #1a202c; padding: 10px; border-radius: 8px; min-width: 100px; }
    </style>
</head>
<body>

<div id="selector-container">
    <h2 style="color: var(--gold);">Se encontraron varios resultados. Elige el correcto:</h2>
    <div id="grid-opciones" class="grid-seleccion"></div>
    <br>
    <button onclick="omitirSeleccion()" style="background: #ff4444;">OMITIR ESTE</button>
</div>

<div class="container">
    <h1>Sincronizador TMDB Premium</h1>
    <p style="color: #94a3b8;">Sincroniza: Sinopsis, Géneros, ID TMDB y Trailers de YouTube.</p>
    
    <div class="stats">
        <div class="stat-box">Total: <span id="count">0</span></div>
        <div class="stat-box" style="color: var(--gold);">Sincronizados: <span id="updated">0</span></div>
        <div class="stat-box" style="color: #ff4444;">Sin éxito: <span id="failed">0</span></div>
    </div>

    <button id="btnStart" onclick="iniciarSincronizacion()">EMPEZAR ESCANEO</button>
    <div id="log">Esperando inicio...</div>
</div>

<script>
    const TMDB_API_KEY = 'cbb1fa07c88626f5c57d56e48d8ce704';
    const _db = "aHR0cHM6Ly9wbGF5ZXJ0di05NDQ5Yy1kZWZhdWx0LXJ0ZGIuZXVyb3BlLXdlc3QxLmZpcmViYXNlZGF0YWJhc2UuYXBwLw==";
    
    firebase.initializeApp({ databaseURL: atob(_db) });
    const database = firebase.database();

    let total = 0, actualizados = 0, fallidos = 0;
    let seleccionResolver = null;

    function log(msg, color = "#00ff00") {
        const div = document.getElementById('log');
        div.innerHTML += `<div style="color:${color}">${msg}</div>`;
        div.scrollTop = div.scrollHeight;
    }

    async function buscarEnTMDB(titulo, esSerie) {
        const tipo = esSerie ? 'tv' : 'movie';
        const url = `https://api.themoviedb.org/3/search/${tipo}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(titulo)}&language=es-ES`;
        
        try {
            const resp = await fetch(url);
            const data = await resp.json();
            
            if (data.results && data.results.length > 1) {
                // Mostrar opciones al usuario si hay más de 1
                return await mostrarSelector(data.results, esSerie);
            } else if (data.results && data.results.length === 1) {
                return data.results[0];
            }
        } catch (e) { return null; }
        return null;
    }

    function mostrarSelector(resultados, esSerie) {
        return new Promise((resolve) => {
            seleccionResolver = resolve;
            const container = document.getElementById('selector-container');
            const grid = document.getElementById('grid-opciones');
            grid.innerHTML = '';
            container.style.display = 'block';

            resultados.forEach(res => {
                const card = document.createElement('div');
                card.className = 'opcion-card';
                const poster = res.poster_path ? `https://image.tmdb.org/t/p/w200${res.poster_path}` : 'https://via.placeholder.com/200x300?text=Sin+Poster';
                const fecha = res.release_date || res.first_air_date || 'N/A';
                
                card.innerHTML = `
                    <img src="${poster}">
                    <h4>${res.title || res.name}</h4>
                    <p style="font-size:12px; color:#94a3b8;">${fecha}</p>
                `;
                card.onclick = () => {
                    container.style.display = 'none';
                    resolve(res);
                };
                grid.appendChild(card);
            });
        });
    }

    function omitirSeleccion() {
        document.getElementById('selector-container').style.display = 'none';
        if (seleccionResolver) seleccionResolver(null);
    }

    async function obtenerDetallesExtras(tmdbId, esSerie) {
        const tipo = esSerie ? 'tv' : 'movie';
        // Buscamos detalles para los géneros y videos para el trailer
        const urlDetalles = `https://api.themoviedb.org/3/${tipo}/${tmdbId}?api_key=${TMDB_API_KEY}&language=es-ES&append_to_response=videos`;
        
        try {
            const resp = await fetch(urlDetalles);
            const data = await resp.json();
            
            const genero = data.genres && data.genres.length > 0 ? data.genres[0].name : "SIN GENERO";
            
            // Buscar trailer de YouTube
            let trailerKey = "";
            if (data.videos && data.videos.results) {
                const trailer = data.videos.results.find(v => v.type === "Trailer" && v.site === "YouTube") || data.videos.results[0];
                if (trailer) trailerKey = trailer.key;
            }

            return { genero, trailer: trailerKey };
        } catch (e) { return { genero: "SIN GENERO", trailer: "" }; }
    }

    async function iniciarSincronizacion() {
        document.getElementById('btnStart').disabled = true;
        log("Iniciando escaneo inteligente...", "#f5c518");
        
        const rutas = ['peliculas', 'series'];
        
        for (const ruta of rutas) {
            log(`--- PROCESANDO ${ruta.toUpperCase()} ---`, "#fff");
            const snap = await database.ref(ruta).once('value');
            const data = snap.val();
            
            if (data) {
                for (const key in data) {
                    let item = data[key];
                    total++;
                    document.getElementById('count').innerText = total;

                    log(`Analizando: ${item.titulo}...`);
                    
                    const resTMDB = await buscarEnTMDB(item.titulo, ruta === 'series');

                    if (resTMDB) {
                        const extras = await obtenerDetallesExtras(resTMDB.id, ruta === 'series');
                        
                        await database.ref(`${ruta}/${key}`).update({
                            sinopsis: resTMDB.overview || "Sin descripción disponible.",
                            genero: extras.genero,
                            id_tmdb: resTMDB.id,
                            trailer: extras.trailer // Se guarda el ID de YouTube
                        });

                        actualizados++;
                        document.getElementById('updated').innerText = actualizados;
                        log(`[OK] Sincronizado: ${resTMDB.title || resTMDB.name}`, "#00ff00");
                    } else {
                        fallidos++;
                        document.getElementById('failed').innerText = fallidos;
                        log(`[!] Saltado o no encontrado`, "#ff4444");
                    }
                    await new Promise(r => setTimeout(r, 300));
                }
            }
        }
        log("--- PROCESO FINALIZADO ---", "#f5c518");
        document.getElementById('btnStart').disabled = false;
    }
</script>
</body>
</html>
