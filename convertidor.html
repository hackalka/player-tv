<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sincronizador Inteligente V2 | PLAYER_TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-6">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-black text-blue-400 mb-2 uppercase italic">🚀 Actualizador Inteligente con Logos</h1>
        
        <div class="bg-slate-800 p-4 rounded-lg mb-6 border border-slate-700">
            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">URL de tu Firebase:</label>
            <input id="firebaseUrl" type="text" value="https://playertv-9449c-default-rtdb.europe-west1.firebasedatabase.app/agenda.json" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm text-blue-300">
        </div>

        <p class="text-slate-400 text-sm mb-2">Pega aquí (Imagen, Nombre y Enlaces mezclados):</p>
        <textarea id="entrada" class="w-full h-64 bg-slate-800 border border-slate-700 rounded-lg p-4 text-xs font-mono mb-4" 
        placeholder="Pega aquí como el ejemplo:&#10;https://imagen.png&#10;Nombre del Canal&#10;acestream://hash1..."></textarea>

        <button onclick="fusionarYEnviar()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-lg font-bold uppercase transition shadow-lg text-lg mb-4">
            🔄 Fusionar y Actualizar Agenda
        </button>

        <div id="status" class="p-4 rounded hidden text-center font-bold border"></div>
    </div>

    <script>
        async function fusionarYEnviar() {
            const url = document.getElementById('firebaseUrl').value;
            const entrada = document.getElementById('entrada').value.trim();
            const statusDiv = document.getElementById('status');
            
            statusDiv.className = "p-4 rounded text-center font-bold bg-blue-600 block";
            statusDiv.innerText = "⏳ Procesando datos y conectando...";

            try {
                // 1. DESCARGAR AGENDA ACTUAL
                const resp = await fetch(url);
                let agendaActual = await resp.json() || {};

                // 2. PROCESAR ENTRADA DE TEXTO MIXTO
                const lineas = entrada.split('\n').map(l => l.trim()).filter(l => l !== "");
                
                let logoDetectado = "https://upload.wikimedia.org/wikipedia/commons/b/b3/Ace_Stream_Logo.png";
                let tituloDetectado = "";
                let hashesEncontrados = [];

                lineas.forEach(linea => {
                    // Detectar si es una imagen (logo)
                    if (linea.match(/\.(jpeg|jpg|gif|png|webp|svg)$/i) || linea.includes('image')) {
                        logoDetectado = linea;
                    } 
                    // Detectar si es un hash de Acestream (40 hex chars)
                    else if (linea.match(/[a-fA-F0-9]{40}/)) {
                        const match = linea.match(/[a-fA-F0-9]{40}/);
                        hashesEncontrados.push(match[0]);
                    }
                    // Si no es imagen ni hash, y aún no tenemos título, es el título
                    else if (!tituloDetectado && linea.length > 2) {
                        // Limpiamos muletillas como "1080p" o asteriscos
                        tituloDetectado = linea.replace(/1080p|\*|\*\*|acestream:\/\/|SD|HD/gi, "").trim().toUpperCase();
                    }
                });

                if (hashesEncontrados.length === 0 || !tituloDetectado) {
                    throw new Error("No se encontró un título o enlaces válidos.");
                }

                // 3. FUSIONAR LÓGICA
                let encontrado = false;
                for (let id in agendaActual) {
                    if (agendaActual[id].titulo === tituloDetectado) {
                        encontrado = true;
                        let hashesViejos = agendaActual[id].link.split(',').map(h => h.trim());
                        let listaFinal = [...new Set([...hashesViejos, ...hashesEncontrados])].filter(h => h !== "");
                        
                        agendaActual[id].link = listaFinal.join(', ');
                        // Actualizamos el logo si hemos pegado uno nuevo
                        if (logoDetectado.includes('http')) {
                            agendaActual[id].logo1 = logoDetectado;
                            agendaActual[id].logo2 = logoDetectado;
                        }
                        break;
                    }
                }

                if (!encontrado) {
                    const nuevoId = "p" + Object.keys(agendaActual).length;
                    agendaActual[nuevoId] = {
                        titulo: tituloDetectado,
                        hora: "--:--",
                        logo1: logoDetectado,
                        logo2: logoDetectado,
                        categoria: "agenda",
                        link: hashesEncontrados.join(', ')
                    };
                }

                // 4. SUBIR A FIREBASE
                const putResp = await fetch(url, {
                    method: 'PUT',
                    body: JSON.stringify(agendaActual),
                    headers: { 'Content-Type': 'application/json' }
                });

                if (putResp.ok) {
                    statusDiv.className = "p-4 rounded text-center font-bold bg-green-600 block";
                    statusDiv.innerText = `✅ ¡Sincronizado! Evento: ${tituloDetectado} con ${hashesEncontrados.length} links.`;
                }

            } catch (error) {
                statusDiv.className = "p-4 rounded text-center font-bold bg-red-600 block";
                statusDiv.innerText = "❌ Error: " + error.message;
            }
        }
    </script>
</body>
</html>
